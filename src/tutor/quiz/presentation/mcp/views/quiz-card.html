<!doctype html>
<!--
  try_quiz_card의 MCP Apps 화면. 빌드 도구 없이 이 파일 하나로 돈다. SDK의 App 클래스 대신 같은 프로토콜
  (JSON-RPC 2.0 over postMessage, ext-apps 2.0.3, 프로토콜 2026-01-26)을 직접 쓴다. 외부 자원은 쓰지 않는다(기본 CSP).
  정답은 받지 않는다. 사용자가 보기와 확신도를 누르면 호스트를 거쳐 서버의 submit_answer를 불러 채점 결과를 받는다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>퀴즈 카드</title>
    <style>
      :root {
        --fg: var(--color-text-primary, light-dark(#141413, #faf9f5));
        --fg-2: var(--color-text-tertiary, light-dark(#73726c, #9c9a92));
        --line: var(--color-border-tertiary, light-dark(rgb(31 30 29 / 15%), rgb(222 220 209 / 15%)));
        --line-strong: var(--color-border-primary, light-dark(rgb(31 30 29 / 40%), rgb(222 220 209 / 40%)));
        --surface: var(--color-background-secondary, light-dark(#f5f4ed, #262624));
        --pick-bg: var(--color-background-inverse, light-dark(#141413, #faf9f5));
        --pick-fg: var(--color-text-inverse, light-dark(#ffffff, #141413));
        --ok-bg: var(--color-background-success, light-dark(#e9f1dc, #1b4614));
        --ok-fg: var(--color-text-success, light-dark(#265b19, #7ab948));
        --bad-bg: var(--color-background-danger, light-dark(#f7ecec, #602a28));
        --bad-fg: var(--color-text-danger, light-dark(#7f2c28, #ee8884));
        --radius: var(--border-radius-lg, 10px);
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        padding: 12px;
        color: var(--fg);
        font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
        font-size: var(--font-text-md-size, 16px);
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }
      .meta {
        margin: 0 0 6px;
        color: var(--fg-2);
        font-size: var(--font-text-sm-size, 14px);
      }
      .prompt {
        margin: 0 0 12px;
        font-weight: var(--font-weight-semibold, 600);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      ol {
        display: grid;
        gap: 8px;
        margin: 0 0 12px;
        padding: 0;
        list-style: none;
      }
      button {
        min-height: 44px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      .choice {
        display: flex;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        text-align: left;
        overflow-wrap: anywhere;
      }
      .choice b {
        flex: none;
      }
      .choice[aria-pressed='true'] {
        border-color: var(--pick-bg);
        background: var(--pick-bg);
        color: var(--pick-fg);
        opacity: 1;
      }
      .ask {
        margin: 0 0 6px;
        color: var(--fg-2);
        font-size: var(--font-text-sm-size, 14px);
      }
      .confidence {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .result {
        margin-top: 12px;
        padding: 12px;
        border-radius: var(--radius);
        background: var(--surface);
      }
      .result.ok {
        background: var(--ok-bg);
      }
      .result.bad {
        background: var(--bad-bg);
      }
      .result h2 {
        margin: 0 0 4px;
        font-size: var(--font-heading-md-size, 16px);
      }
      .result.ok h2 {
        color: var(--ok-fg);
      }
      .result.bad h2 {
        color: var(--bad-fg);
      }
      .result p {
        margin: 4px 0 0;
        overflow-wrap: anywhere;
      }
      .status {
        margin: 12px 0 0;
        color: var(--fg-2);
        font-size: var(--font-text-xs-size, 12px);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main id="card" hidden>
      <p class="meta" id="meta"></p>
      <p class="prompt" id="prompt"></p>
      <ol id="choices"></ol>
      <p class="ask">보기를 고른 뒤 확신도를 누르면 채점한다</p>
      <div class="confidence" id="confidence">
        <button type="button" data-confidence="SURE" disabled>확실</button>
        <button type="button" data-confidence="UNSURE" disabled>애매</button>
        <button type="button" data-confidence="GUESS" disabled>찍음</button>
      </div>
      <section class="result" id="result" hidden aria-live="polite"></section>
    </main>
    <p class="status" id="status">문제를 기다리는 중</p>
    <script>
      'use strict';
      const PROTOCOL_VERSION = '2026-01-26';
      const $ = (id) => document.getElementById(id);
      const root = document.documentElement;
      const host = { name: '?', platform: '?', serverTools: false };
      let card = null;
      let picked = null;

      // JSON-RPC over postMessage. SDK의 PostMessageTransport처럼 부모 창에서 온 메시지만 받는다.
      let nextId = 1;
      const pending = new Map();
      const send = (message) => window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
      const notify = (method, params) => send({ method, params });
      const request = (method, params) =>
        new Promise((resolve, reject) => {
          const id = nextId++;
          pending.set(id, { resolve, reject });
          send({ id, method, params });
        });

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const m = event.data;
        if (!m || m.jsonrpc !== '2.0') return;
        if (m.method === undefined) {
          const waiter = pending.get(m.id);
          pending.delete(m.id);
          if (m.error) waiter?.reject(new Error(m.error.message));
          else waiter?.resolve(m.result);
        } else if (m.id !== undefined) {
          // 호스트의 요청: ping, ui/resource-teardown은 빈 결과로 답한다.
          const known = m.method === 'ping' || m.method === 'ui/resource-teardown';
          send(
            known
              ? { id: m.id, result: {} }
              : { id: m.id, error: { code: -32601, message: `모르는 요청: ${m.method}` } },
          );
        } else if (m.method === 'ui/notifications/tool-result') {
          show(m.params);
        } else if (m.method === 'ui/notifications/host-context-changed') {
          applyContext(m.params);
        }
      });

      function applyContext(ctx) {
        if (!ctx) return;
        if (ctx.theme) {
          root.dataset.theme = ctx.theme;
          root.style.colorScheme = ctx.theme;
        }
        for (const [name, value] of Object.entries(ctx.styles?.variables ?? {})) {
          if (value !== undefined) root.style.setProperty(name, value);
        }
        const inset = ctx.safeAreaInsets;
        if (inset) {
          const pad = (n) => `${Math.max(12, n)}px`;
          document.body.style.padding = [inset.top, inset.right, inset.bottom, inset.left].map(pad).join(' ');
        }
        if (ctx.platform) host.platform = ctx.platform;
        renderStatus();
      }

      function renderStatus(extra) {
        const tools = host.serverTools ? '카드에서 채점 가능' : '카드에서 채점 불가(채팅으로 답한다)';
        $('status').textContent = [`호스트 ${host.name} · ${host.platform} · ${tools}`, extra]
          .filter(Boolean)
          .join(' · ');
      }

      function show(result) {
        const data = result?.structuredContent;
        if (!data || !Array.isArray(data.choices)) {
          renderStatus(result?.content?.[0]?.text ?? '문제가 없다');
          return;
        }
        card = data;
        $('meta').textContent = `${data.concept} · 문제 ${data.questionId}`;
        $('prompt').textContent = data.prompt;
        $('choices').replaceChildren(
          ...data.choices.map((text, i) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'choice';
            button.setAttribute('aria-pressed', 'false');
            button.append(Object.assign(document.createElement('b'), { textContent: `${i + 1}` }), text);
            button.onclick = () => pick(i + 1);
            const li = document.createElement('li');
            li.append(button);
            return li;
          }),
        );
        $('card').hidden = false;
        renderStatus();
      }

      function pick(n) {
        picked = n;
        $('choices')
          .querySelectorAll('.choice')
          .forEach((b, i) => b.setAttribute('aria-pressed', String(i + 1 === n)));
        setConfidenceEnabled(host.serverTools);
      }

      function setConfidenceEnabled(enabled) {
        $('confidence')
          .querySelectorAll('button')
          .forEach((b) => (b.disabled = !enabled));
      }

      async function submit(confidence) {
        if (!card || picked === null) return;
        setConfidenceEnabled(false);
        $('choices')
          .querySelectorAll('button')
          .forEach((b) => (b.disabled = true));
        renderStatus('채점하는 중');
        try {
          const result = await request('tools/call', {
            name: 'submit_answer',
            arguments: { questionId: card.questionId, answer: String(picked), confidence, hintUsed: false },
          });
          renderResult(result);
          renderStatus();
        } catch (e) {
          renderStatus(`채점 실패: ${e.message}`);
          setConfidenceEnabled(true);
        }
      }

      function renderResult(result) {
        const box = $('result');
        const g = result?.structuredContent;
        if (result?.isError || !g) {
          box.className = 'result';
          box.replaceChildren(para(result?.content?.[0]?.text ?? '채점 결과가 없다'));
        } else {
          box.className = g.correct ? 'result ok' : 'result bad';
          box.replaceChildren(
            Object.assign(document.createElement('h2'), { textContent: g.correct ? '정답' : '오답' }),
            ...(g.correct ? [] : [para(`정답: ${g.correctAnswer}`)]),
            ...(g.misconception ? [para(`고른 보기의 오개념: ${g.misconception}`)] : []),
            para(`해설: ${g.explanation}`),
            ...(g.nextReview ? [para(`다음 복습: ${g.nextReview}`)] : []),
          );
        }
        box.hidden = false;
      }

      const para = (text) => Object.assign(document.createElement('p'), { textContent: text });

      $('confidence')
        .querySelectorAll('button')
        .forEach((b) => (b.onclick = () => submit(b.dataset.confidence)));

      // 내용 높이를 호스트에 알린다(SDK의 setupSizeChangedNotifications와 같은 방식).
      let lastHeight = 0;
      const reportSize = () => {
        const saved = root.style.height;
        root.style.height = 'max-content';
        const height = Math.ceil(root.getBoundingClientRect().height);
        root.style.height = saved;
        if (height === lastHeight) return;
        lastHeight = height;
        notify('ui/notifications/size-changed', { width: Math.ceil(window.innerWidth), height });
      };

      async function connect() {
        const init = await request('ui/initialize', {
          appInfo: { name: 'growth-assistant-quiz-card', version: '0.0.1' },
          appCapabilities: { availableDisplayModes: ['inline'] },
          protocolVersion: PROTOCOL_VERSION,
        });
        host.name = init?.hostInfo?.name ?? '?';
        host.serverTools = Boolean(init?.hostCapabilities?.serverTools);
        applyContext(init?.hostContext);
        notify('ui/notifications/initialized', {});
        new ResizeObserver(() => requestAnimationFrame(reportSize)).observe(document.body);
        reportSize();
      }

      connect().catch((e) => renderStatus(`호스트 연결 실패: ${e.message}`));
    </script>
  </body>
</html>
