spring:
  application:
    name: growth-assistant
  config:
    # 비밀값(봇 토큰 등)은 레포 밖 .env에 둔다. docker compose도 같은 파일을 읽는다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:growth}
    username: ${POSTGRES_USER:growth}
    password: ${POSTGRES_PASSWORD:growth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

growth:
  discord:
    enabled: true
    token: ${DISCORD_BOT_TOKEN:}
    guild-id: ${DISCORD_GUILD_ID:0}
    owner-user-id: ${DISCORD_OWNER_USER_ID:0}
  claude:
    executable: ${CLAUDE_EXECUTABLE:claude}
    work-dir: ${user.home}/.growth-assistant/claude-work
    max-concurrency: 2
    purposes:
      tutor-chat:
        model: sonnet
        timeout: 180s
        web-access: true
      session-summary:
        model: sonnet
        timeout: 120s
