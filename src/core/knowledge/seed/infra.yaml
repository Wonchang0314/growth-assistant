# 시드 개념: IT 인프라 (ADR-0022). 형식은 js.yaml 머리말
# 구성은 인프런 "Docker가 쉬워지는 운영체제 이야기"(널널한 개발자) 커리큘럼을 따른다.
# 운영체제(CPU·프로세스·파일 시스템·가상 메모리)에서 시작해 컨테이너 조각(Overlay, Namespace, cgroups)과
# 리눅스 네트워크(NAT, netfilter)를 거쳐 Docker로 올라간다.

track:
  key: infra
  name: IT 인프라
  weight: 0.2
  description: 운영체제에서 컨테이너까지. Docker를 이루는 리눅스 기능(가상 메모리, 파일 시스템, Namespace, cgroups, netfilter)을 이해하고 문제를 운영체제 수준에서 진단하기

concepts:
  # 하드웨어 (섹션 2)
  - name: 하드웨어 기초
    aliases: [컴퓨터 구조, computer architecture, 하드웨어]
    description: 운영체제 이야기의 물리적 토대인 CPU와 메모리

  - name: CPU와 연산 흐름
    parent: 하드웨어 기초
    aliases: [CPU, 기계어, 명령어, instruction, 레지스터, register, 연산 흐름, 프로그램 카운터]
    description: CPU가 명령어를 가져와 실행하는 흐름과 그때 유지하는 맥락(레지스터 상태)

  - name: 메모리 계층
    parent: 하드웨어 기초
    aliases: [memory hierarchy, CPU 캐시, 캐시 메모리, RAM, SSD, 지역성, locality]
    description: 레지스터·캐시·RAM·SSD의 속도와 용량 차이, 지역성이 성능에 주는 영향
    requires: [CPU와 연산 흐름]

  # 실행 (섹션 3)
  - name: 프로세스와 실행
    aliases: [실행, 운영체제, OS, operating system, 커널, kernel]
    description: 운영체제가 프로그램을 실행하고 관리하는 방식

  - name: 프로그램과 프로세스
    parent: 프로세스와 실행
    aliases: [프로세스, process, 프로그램, program, 실행 파일, 행위의 주체와 대상]
    description: 디스크의 프로그램이 메모리에 올라 프로세스가 되는 과정, 행위의 주체(프로세스)와 대상(파일)
    requires: [CPU와 연산 흐름]

  - name: 컴파일 언어와 가상 머신
    parent: 프로세스와 실행
    aliases: [컴파일, compile, JVM, 자바 가상 머신, 바이트코드, bytecode, 인터프리터, JIT]
    description: C 코드가 기계어로 실행되는 방식과 Java가 JVM 위에서 실행되는 방식의 차이
    requires: [프로그램과 프로세스]

  - name: 프로세스와 스레드
    parent: 프로세스와 실행
    aliases: [thread, 스레드, 멀티스레드, 멀티프로세스, multithreading]
    description: 프로세스와 스레드가 나눠 쓰는 것과 따로 갖는 것, 각각을 고르는 기준
    requires: [프로그램과 프로세스]

  - name: 스케줄링과 컨텍스트 스위칭
    parent: 프로세스와 실행
    aliases: [스케줄링, scheduling, CPU 스케줄링, context switching, 컨텍스트 스위칭, 문맥 교환, 선점]
    description: 작업 단위를 번갈아 실행하는 방식과 전환 비용
    requires: [프로세스와 스레드]

  - name: 프로세스 관계와 권한
    parent: 프로세스와 실행
    aliases: [부모 프로세스, 자식 프로세스, fork, exec, PID, 사용자와 그룹, root 권한, sudo, setuid, 시그널]
    description: 프로세스가 프로세스를 낳는 구조, 프로세스가 가진 사용자 권한과 상속
    requires: [프로그램과 프로세스]

  # 파일 시스템 (섹션 4)
  - name: 파일 시스템
    aliases: [file system, 파일시스템]
    description: 저장 장치 위에서 파일과 디렉터리를 관리하는 구조

  - name: 파일 저장 구조
    parent: 파일 시스템
    aliases: [정보 단위, 디렉토리, 디렉터리, directory, inode, 아이노드, 블록, 섹터, 클러스터, 하드 링크, 심볼릭 링크]
    description: 파일 데이터와 메타데이터가 실제로 저장되는 위치, 디렉터리가 이름과 inode를 잇는 방식

  - name: 파일 삭제와 복원
    parent: 파일 시스템
    aliases: [파일 삭제, 파일 복원, unlink, 언링크, 백신 실시간 감시, 파일 시스템 필터 드라이버]
    description: 삭제가 실제로 지우는 것과 남기는 것, 그래서 복원이 가능한 이유, 백신이 파일 접근을 가로채는 원리
    requires: [파일 저장 구조]

  - name: OS별 디렉터리 구조
    parent: 파일 시스템
    aliases: [FHS, /etc, /var, /usr, /proc, Program Files, 리눅스 디렉토리 구조]
    description: Windows와 Linux의 주요 디렉터리 역할 비교

  - name: 프로그램 설치
    parent: 파일 시스템
    aliases: [설치, 패키지 설치, apt, 레지스트리, 공유 라이브러리, shared library, PATH 환경 변수]
    description: 프로그램 "설치"가 실제로 하는 일(파일 배치, 설정 등록, 라이브러리 연결)
    requires: [OS별 디렉터리 구조]

  - name: 리눅스 파일 관리 명령
    parent: 파일 시스템
    aliases: [ls, chmod, chown, 파일 권한, 파일 소유권, permission, '0600', '0755', find, du, df, ln]
    description: 파일 탐색·복사·권한 변경 명령과 권한 비트 읽기
    related: [프로세스 관계와 권한]

  # 가상 메모리 (섹션 5)
  - name: 가상 메모리
    aliases: [virtual memory, 가상 메모리 시스템]
    description: 프로세스마다 독립된 주소 공간을 주는 운영체제의 핵심 기술

  - name: 가상 주소와 페이징
    parent: 가상 메모리
    aliases:
      [가상 주소, 물리 주소, 메모리 페이지, memory page, 페이징, paging, 페이지 테이블, MMU, 페이지 폴트, page fault]
    description: 가상 주소가 페이지 테이블로 물리 주소가 되는 과정
    requires: [메모리 계층, 프로그램과 프로세스]

  - name: 프로세스 메모리 격리
    parent: 가상 메모리
    aliases: [메모리 격리, 주소 공간, address space, 메모리 해킹, 메모리 보호]
    description: 프로세스가 서로의 메모리를 볼 수 없는 이유와, 게임 해킹 기법이 그 격리를 넘는 방식
    requires: [가상 주소와 페이징]

  - name: 메모리 스왑
    parent: 가상 메모리
    aliases: [swap, 스왑, 스왑 아웃, 페이지 아웃, OOM, OOM killer, 메모리 부족]
    description: RAM이 부족할 때 디스크로 내보내 버티는 방식과 그 대가
    requires: [가상 주소와 페이징]

  - name: Copy on Write
    parent: 가상 메모리
    aliases: [CoW, COW, 쓰기 시 복사]
    description: 복사를 미뤘다가 쓸 때만 복사하는 기법과 fork·스냅샷에서의 쓰임
    requires: [가상 주소와 페이징]

  - name: 프로세스 간 통신
    parent: 가상 메모리
    aliases: [IPC, 공유 메모리, shared memory, 파이프, pipe, 메시지 큐]
    description: 격리된 프로세스끼리 데이터를 주고받는 방법들
    requires: [프로세스 메모리 격리]

  - name: 메모리 맵 파일과 RAM 드라이브
    parent: 가상 메모리
    aliases: [mmap, 메모리 맵 파일, 파일 주소 공간, RAM 드라이브, RAM disk, tmpfs, 페이지 캐시]
    description: 파일을 주소 공간에 매핑하는 원리와 고성능 시스템에서의 쓰임
    requires: [가상 주소와 페이징, 파일 저장 구조]

  # 컨테이너 (섹션 6~8)
  - name: 컨테이너 기술
    aliases: [container, 컨테이너, 리눅스 컨테이너, linux containers, LXC, 가상화]
    description: 리눅스가 원래 가진 기능을 묶어 프로세스를 격리하는 기술

  - name: Overlay 파일 시스템
    parent: 컨테이너 기술
    aliases: [OverlayFS, overlay, 유니온 파일 시스템, union mount, 레이어, lowerdir, upperdir, PC방 HDD 복구]
    description: 읽기 전용 아래층 위에 쓰기 층을 겹치는 구조, PC방 복구와 이미지 레이어가 같은 원리인 이유
    requires: [Copy on Write, 파일 저장 구조]

  - name: 리눅스 Namespace
    parent: 컨테이너 기술
    aliases: [namespace, 네임스페이스, PID namespace, network namespace, mount namespace, user namespace, UTS namespace]
    description: 프로세스가 보는 시스템 자원(PID, 네트워크, 마운트 등)을 나눠 격리하는 기능
    requires: [프로세스 관계와 권한]

  - name: cgroups
    parent: 컨테이너 기술
    aliases: [control groups, cgroup, 자원 제한, CPU 제한, 메모리 제한, 자원 사용 통제]
    description: 프로세스 묶음의 CPU·메모리 사용량을 제한하고 측정하는 기능
    requires: [스케줄링과 컨텍스트 스위칭]
    related: [메모리 스왑]

  - name: 컨테이너 이미지 표준
    parent: 컨테이너 기술
    aliases: [OCI, OCI 이미지, 이미지 표준, image spec, runtime spec, runc, 컨테이너 런타임]
    description: OCI 이미지·런타임 표준과 Docker가 그 표준 위에 있는 이유
    requires: [Overlay 파일 시스템]

  - name: Docker 없이 컨테이너 실행
    parent: 컨테이너 기술
    aliases: [unshare, chroot, pivot_root, 수동 컨테이너]
    description: Namespace·cgroups·Overlay를 직접 조합해 컨테이너를 띄워 보는 과정
    requires: [리눅스 Namespace, cgroups, Overlay 파일 시스템]

  # 리눅스 네트워크 (섹션 9)
  - name: 리눅스 네트워크
    aliases: [linux networking, 네트워크 가상화]
    description: 리눅스 커널 안에서 패킷이 흐르고 걸러지는 구조

  - name: NAT와 포트포워딩
    parent: 리눅스 네트워크
    aliases: [NAT, 공유기, port forwarding, 포트포워딩, SNAT, DNAT, 마스커레이드, masquerade]
    description: 공유기가 사설 주소를 공인 주소로 바꾸는 원리와 포트포워딩
    requires: [IP 주소와 서브넷]
    related: [라우팅]

  - name: netfilter와 iptables
    parent: 리눅스 네트워크
    aliases: [netfilter, iptables, chain, 체인, PREROUTING, POSTROUTING, INPUT 체인, 방화벽 규칙, nftables]
    description: 커널의 패킷 처리 지점(Chain)과 iptables로 규칙을 거는 법
    requires: [NAT와 포트포워딩]

  - name: 리눅스 네트워크 스택 흐름
    parent: 리눅스 네트워크
    aliases: [네트워크 Internals, 패킷 흐름, NIC, veth, 브리지, bridge, 가상 네트워크 인터페이스]
    description: 패킷이 NIC에서 프로세스 소켓까지 가는 흐름과 가상 인터페이스·브리지
    requires: [netfilter와 iptables, 소켓과 포트]

  - name: 리눅스 네트워크 관리 명령
    parent: 리눅스 네트워크
    aliases: [ip 명령, ip addr, ip route, ss, netstat, tcpdump, ping, curl, nc, 연결 진단]
    description: 주소·경로·연결 상태를 보고 연결 문제를 좁혀 가는 명령
    related: [TCP]

  # Docker (섹션 10~11)
  - name: Docker
    aliases: [도커, docker]
    description: 리눅스 컨테이너 기능을 쓰기 쉽게 포장한 도구

  - name: Docker 이미지와 컨테이너
    parent: Docker
    aliases: [Docker 이미지, 이미지, image, Dockerfile, 이미지 빌드, 레이어 캐시, 멀티 스테이지 빌드]
    description: 이미지와 컨테이너의 관계, Dockerfile로 이미지를 만들 때 레이어가 쌓이는 방식
    requires: [컨테이너 이미지 표준]

  - name: 컨테이너 생명주기와 명령
    parent: Docker
    aliases: [docker run, docker ps, docker exec, docker logs, 라이프 사이클, 재시작 정책]
    description: 컨테이너의 상태 변화와 주요 명령
    requires: [Docker 이미지와 컨테이너]

  - name: Docker 볼륨
    parent: Docker
    aliases: [volume, 볼륨, 바인드 마운트, bind mount, 데이터 영속성]
    description: 컨테이너가 지워져도 데이터를 남기는 법과 볼륨·바인드 마운트의 차이
    requires: [Overlay 파일 시스템]

  - name: Docker 네트워크
    parent: Docker
    aliases: [컨테이너 네트워크, bridge network, 사용자 정의 네트워크, 컨테이너 DNS, 포트 매핑, 컨테이너 안의 localhost]
    description: 컨테이너끼리, 호스트와 컨테이너가 통신하는 구조와 이름 해석
    requires: [리눅스 네트워크 스택 흐름, 리눅스 Namespace]

  - name: Docker Compose
    parent: Docker
    aliases: [compose, docker-compose, docker compose, 멀티 컨테이너]
    description: 여러 컨테이너와 네트워크·볼륨을 파일 하나로 정의하는 법
    requires: [Docker 네트워크, Docker 볼륨]

  - name: 서비스 컨테이너화
    parent: Docker
    aliases: [3-tier 컨테이너화, 컨테이너화, containerization]
    description: 프론트엔드·API 서버·DB로 이루어진 서비스를 이미지·볼륨·네트워크로 구성하는 흐름
    requires: [Docker 이미지와 컨테이너, Docker 볼륨, Docker 네트워크]
