# 시드 개념: IT 인프라 (ADR-0021). 형식은 cs.yaml 머리말을 따른다.

track:
  key: infra
  name: IT 인프라
  weight: 0.2
  description: 구성·운영·진단. 어떻게 구성하고 고장을 진단하나 (네트워크·인증서 운영, 리눅스, Docker, nginx, CI/CD, DB 운영)

concepts:
  # 네트워크 운영
  - name: 네트워크 운영
    aliases: [network operations, 네트워크 진단]
    description: 방화벽, VPN, 망 구성을 다루고 연결 장애를 진단하는 일
    requires: [컴퓨터 네트워크]

  - name: 방화벽 규칙
    parent: 네트워크 운영
    aliases: [firewall, inbound, outbound, security group, ACL, 포트 개방]
    description: 출발 방향과 포트마다 열린 규칙이 달라 같은 목적지라도 경로에 따라 막힌다
    requires: [TCP 연결 수립과 실패 유형]

  - name: VPN과 경로 진단
    parent: 네트워크 운영
    aliases: [VPN, SSL VPN, split tunneling, 비대칭 라우팅, NAT 헤어핀 진단]
    description: VPN은 라우팅을 바꿔 트래픽이 다른 방향으로 도착하게 한다. 그래서 VPN을 켜면 열리던 곳이 막히기도 한다
    requires: [라우팅 테이블, NAT와 포트포워딩]

  - name: 연결 장애 진단
    parent: 네트워크 운영
    aliases: [tcpdump, curl -v, nc, 패킷 캡처, 장애 지점 좁히기]
    description: 에러 종류와 패킷 캡처로 어느 관문까지 통과했는지 거꾸로 짚는다. 장애가 난 경로와 같은 경로로 재현한다
    requires: [TCP 연결 수립과 실패 유형]

  - name: 망 분리 배포 구성
    parent: 네트워크 운영
    aliases: [DMZ, private subnet, 내부망, 외부 공개, 2-VM 분리, 최소 노출]
    description: 화면은 밖에 열고 API·DB는 내부망에 둔다. 백엔드 포트는 프런트 서버에만 연다
    requires: [NAT와 포트포워딩]

  # DNS·인증서 운영
  - name: DNS와 인증서 운영
    aliases: [domain, 도메인 운영, certificate operations]
    description: 도메인 레코드와 인증서를 발급·교체·이전하는 일
    requires: [DNS 이름 해석, TLS]

  - name: DNS 레코드 관리
    parent: DNS와 인증서 운영
    aliases: [A record, CNAME, TXT record, split-horizon DNS, DNS 리바인딩 보호, 도메인 이전]
    description: 레코드 종류와 내부·외부에 다른 응답을 주는 구성. 도메인을 옮길 때는 DNS가 먼저 바뀌어야 트래픽이 온다

  - name: 인증서 발급과 갱신
    parent: DNS와 인증서 운영
    aliases:
      [
        ACME,
        "Let's Encrypt",
        certbot,
        HTTP-01,
        DNS-01,
        인증서 갱신,
        자체 서명 인증서,
        self-signed certificate,
        사설 인증서,
      ]
    description: HTTP-01은 바깥에서 서버로 들어올 수 있어야 하고, DNS-01은 TXT 레코드로 증명한다. CA 없이 만든 자체 서명 인증서는 내부 테스트용이다
    requires: [인증서 체인과 서명]

  - name: HSTS
    parent: DNS와 인증서 운영
    aliases: [HTTP Strict Transport Security, 강제 HTTPS]
    description: 한 번 받은 브라우저는 HTTPS만 쓴다. 정식 인증서 없이 도메인을 옮기면 우회할 수 없이 막힌다

  - name: 레거시 TLS 호환
    parent: DNS와 인증서 운영
    aliases: [jdk.tls.disabledAlgorithms, jdk.certpath.disabledAlgorithms, TLS 1.2 고정, JSSE, 구형 서버]
    description: 새 런타임이 거부하는 구형 서버와 협상하려고 금지 목록을 완화하는 방법과 적용 시점
    requires: [TLS 핸드셰이크]

  # 리눅스 운영
  - name: 리눅스 서버 운영
    aliases: [Linux, 서버 관리, sysadmin]
    description: 계정·권한·서비스·원격 접속을 관리하는 일
    requires: [운영체제]

  - name: 권한 오류 진단
    parent: 리눅스 서버 운영
    aliases: [Permission denied, EACCES, 실행 계정, 소유자]
    description: 권한 오류는 실행한 계정과 대상의 소유자·권한이 어긋날 때 난다. 누가 실행했는지부터 확인한다
    requires: [파일 권한과 소유권, 사용자와 그룹]

  - name: 서비스 관리
    parent: 리눅스 서버 운영
    aliases: [systemd, systemctl, systemd unit, launchd, snap, apt, 패키지 설치 방식]
    description: 서비스 유닛으로 프로세스를 띄우고 관리한다. 설치 방식에 따라 유닛 이름과 동작이 다르다

  - name: SSH 키 관리
    parent: 리눅스 서버 운영
    aliases: [authorized_keys, ssh-copy-id, 'chmod 600', 키 배포, OpenSSH key format]
    description: 대상 서버마다 공개키를 등록하고, 개인키 파일은 경계선·끝 개행·600 권한을 지켜야 한다
    requires: [공개키 암호와 SSH 인증]

  # 컨테이너
  - name: 컨테이너
    aliases: [Docker, container, 도커]
    description: 이미지·네트워크·볼륨으로 격리된 실행 환경을 만드는 방식
    requires: [운영체제]

  - name: 이미지와 레이어
    parent: 컨테이너
    aliases: [Dockerfile, image layer, layer cache, COPY, RUN, 멀티 스테이지 빌드]
    description: 명령마다 레이어가 쌓인다. 앞선 명령에게는 뒤에서 복사한 파일이 존재하지 않는다

  - name: 컨테이너 네트워크
    parent: 컨테이너
    aliases: [bridge network, host.docker.internal, host-gateway, 컨테이너 localhost, 서비스 이름 DNS]
    description: 컨테이너 안의 localhost는 컨테이너 자신이다. 호스트는 게이트웨이 주소로, 다른 컨테이너는 서비스 이름으로 닿는다
    requires: [IP 주소와 서브넷]

  - name: 볼륨과 바인드 마운트
    parent: 컨테이너
    aliases: [volume, bind mount, named volume, 데이터 보존]
    description: 데이터를 컨테이너 밖에 두는 방식. 바인드 경로는 compose를 실행한 계정 기준으로 풀린다

  - name: Docker Compose
    parent: 컨테이너
    aliases: [docker compose, depends_on, healthcheck, --no-deps, restart policy]
    description: 여러 컨테이너를 함께 띄우는 정의. up은 의존 서비스까지 만들려 한다

  - name: 이미지 태그와 롤백
    parent: 컨테이너
    aliases: [image tag, image ID, docker save, docker load, 롤백 이미지]
    description: 태그는 새 이미지로 옮겨 가지만 떠 있는 컨테이너는 원래 이미지를 가리킨다. 그래서 롤백 재료가 된다

  - name: 도커 소켓 권한
    parent: 컨테이너
    aliases: [docker.sock, docker group, Testcontainers 소켓]
    description: 도커 소켓에 접근할 수 있으면 사실상 root다. docker 그룹에 넣고 새 세션에서 반영된다
    requires: [유닉스 도메인 소켓, 사용자와 그룹]

  - name: 컨테이너 DB 초기화
    parent: 컨테이너
    aliases: [docker-entrypoint-initdb.d, pg_isready, 초기화 스크립트, init race]
    description: 초기화 스크립트는 빈 볼륨에서만 돈다. 초기화 중 임시 서버에도 준비 확인이 통과할 수 있다

  # 웹 서버
  - name: 웹 서버와 리버스 프록시
    aliases: [nginx, web server, reverse proxy, 엣지]
    description: 정적 파일 서빙과 뒤쪽 서버로의 요청 전달
    requires: [HTTP]

  - name: 리버스 프록시
    parent: 웹 서버와 리버스 프록시
    aliases: [proxy_pass, upstream, 프록시 헤더, X-Forwarded-For]
    description: 클라이언트 대신 뒤쪽 서버에 요청을 넘긴다. Host와 원래 주소 헤더를 어떻게 넘길지 정한다

  - name: nginx 설정 상속
    parent: 웹 서버와 리버스 프록시
    aliases: [directive inheritance, http server location, add_header, 설정 컨텍스트]
    description: 하위 블록에 없으면 상위 값을 물려받고 있으면 교체한다. add_header는 하나만 있어도 상위 것이 전부 사라진다

  - name: 응답 압축 설정
    parent: 웹 서버와 리버스 프록시
    aliases: [nginx gzip, gzip_types, gzip_proxied, gzip_static, brotli_static, 사전압축]
    description: 엣지 한 곳에서 압축하거나 빌드 때 미리 압축한다. 압축 대상은 Content-Type으로 고른다
    requires: [데이터 압축, HTTP 헤더와 콘텐츠 협상]

  - name: 정적 자산 캐시 설정
    parent: 웹 서버와 리버스 프록시
    aliases: [immutable, expires, Cache-Control 설정, 버전 URL]
    description: 내용이 바뀌면 URL도 바뀌게 해서 오래 캐시해도 안전하게 만든다
    requires: [HTTP 캐싱]

  # CI/CD
  - name: CI/CD 파이프라인
    aliases: [CI/CD, continuous integration, continuous deployment, GitHub Actions, GitLab CI]
    description: 푸시 뒤 검사·빌드·배포를 자동으로 돌리는 구성

  - name: 파이프라인 구성
    parent: CI/CD 파이프라인
    aliases:
      [
        stages,
        jobs,
        include,
        extends,
        parent-child pipeline,
        .gitlab-ci.yml,
        workflow,
        배포 직렬화,
        resource_group,
        concurrency,
        interruptible,
        cancel-in-progress,
      ]
    description: 파일 하나에서 갈라지는 방식과 여러 파일·자식 파이프라인으로 나누는 방식, 각각 물려받는 설정. 배포는 하나씩 돌게 하고 검사는 옛 실행을 취소한다

  - name: 실행 조건
    parent: CI/CD 파이프라인
    aliases: [rules, workflow:rules, 'rules:changes', only/except, 중복 파이프라인]
    description: 어떤 이벤트·브랜치·변경에서 돌지. 푸시가 아닌 실행에서는 변경 조건이 늘 참이 된다

  - name: 러너와 실행기
    parent: CI/CD 파이프라인
    aliases: [runner, executor, shell executor, docker executor, tags, self-hosted runner]
    description: 서버는 계획하고 러너가 실행한다. 태그가 맞아야 배정되고, 실행기에 따라 환경이 다르다

  - name: 시크릿과 변수
    parent: CI/CD 파이프라인
    aliases: [secrets, CI variables, masked, protected, file variable]
    description: 파일 타입 변수는 값이 아니라 경로로 들어오고, 보호 변수는 보호 브랜치에서만 주입된다

  - name: 배포 헬스체크와 롤백
    parent: CI/CD 파이프라인
    aliases: [health check polling, 배포 롤백, cold start, 자동 롤백]
    description: 띄운 뒤 준비 상태를 폴링하고 실패하면 이전 이미지로 되돌린다. 대기 시간은 기동 시간을 감안한다
    requires: [헬스 체크와 준비 상태]

  - name: 배포 방식
    parent: CI/CD 파이프라인
    aliases: [push deploy, pull deploy, SSH 배포, registry, 빌드와 실행 분리, 릴리스 디렉터리]
    description: 레지스트리에서 당겨 오는 방식과 SSH로 밀어 넣는 방식, 빌드하는 곳과 실행하는 곳의 분리

  # 환경과 설정
  - name: 빌드 타임 설정과 런타임 설정
    aliases: [baked config, environment variables, 환경 변수, 설정 주입, .env]
    description: 이미지에 구운 설정은 재배포해야 바뀐다. 무엇을 실행 시점에 주입할지 정한다

  - name: 환경 간 설정 차이
    parent: 빌드 타임 설정과 런타임 설정
    aliases: [config drift, 운영 설정, 로컬 설정, 레포 밖 설정]
    description: 운영 설정이 레포 밖에만 있으면 로컬과 동작이 달라져 운영에서만 나는 오류가 생긴다

  - name: 패키지 매니저 버전 고정
    aliases: [corepack, packageManager, pnpm, npm, lockfile, 빌드 스크립트 승인]
    description: 설치한 버전과 실행되는 버전이 다를 수 있다. packageManager 필드와 corepack이 버전을 정한다

  # DB 운영
  - name: 데이터베이스 운영
    aliases: [DB operations, DBA, PostgreSQL 운영]
    description: 접속 인증, 네트워크 설정, 백업·복원
    requires: [데이터베이스 이론]

  - name: DB 접속 인증
    parent: 데이터베이스 운영
    aliases: [pg_hba.conf, peer, scram-sha-256, trust, md5]
    description: 소켓인지 TCP인지에 따라 다른 인증을 쓴다. peer는 비밀번호를 검사하지 않는다
    requires: [유닉스 도메인 소켓]

  - name: DB 네트워크 설정
    parent: 데이터베이스 운영
    aliases: [listen_addresses, 허용 대역, 원격 접속]
    description: DB가 어느 주소에서 접속을 받고 어느 대역을 허용하는지
    requires: [컨테이너 네트워크]

  - name: 백업과 복원
    parent: 데이터베이스 운영
    aliases: [pg_dump, pg_restore, dump, restore, '-Fc', --no-owner]
    description: 덤프 형식에 따라 복원 방법이 다르고, 격리 복사본으로 리허설한다
