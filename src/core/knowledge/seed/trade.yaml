  - name: 인코텀즈
    parent: 무역 거래
    aliases: [Incoterms, Incoterms 2020, 인코텀스, 무역 조건, 가격 조건, FOB, CIF, CFR, EXW, FCA, DAP, DDP, 위험 이전]
    description: 매도인과 매수인 사이에 비용과 위험이 넘어가는 지점을 정하는 국제상업회의소의 거래 조건
    related: [인도기준과 진행기준]

  - name: 선하증권
    parent: 무역 거래
    aliases:
      [B/L, Bill of Lading, Master B/L, House B/L, MBL, HBL, 서렌더, Surrendered B/L, 해상화물운송장, Sea Waybill]
    description: 운송인이 화물을 받았다는 증거이자 화물을 인도받을 권리를 나타내는 증권, 원본·서렌더·운송장의 차이

  - name: 선적과 입항 일정
    parent: 무역 거래
    aliases: [ETD, ETA, 선적 일정, 입항 일정, 선적 스케줄, 도착 예정일]
    description: 출항·도착 예정일이 바뀔 때 입고·납기 답변이 어떻게 따라 바뀌는지

  - name: 미착품
    parent: 무역 거래
    aliases: [미착 재고, 미착 상품, 운송 중 매입품, goods in transit, 미착 정산]
