    requires: [수입 통관]

  - name: 수입 검사와 검역
    parent: 수입 통관
    aliases: [수입식품 신고, 수입식품 검사, 정밀검사, 검역 보류, 동식물 검역, quarantine]
    description: 수입식품은 식약처에 따로 수입신고하고 검사·검역을 마칠 때까지 판매할 수 없는 보류 상태
    requires: [수입 통관]
    related: [재고 상태]

  - name: 관세와 품목분류
    parent: 무역 거래
    aliases: [HS 코드, HS code, HSK, 품목분류, 관세율, 과세가격, FTA, 원산지증명서, 협정세율]
    description: 국제 공통 6자리(한국은 HSK 10자리) 품목분류로 세율을 정하고, FTA 원산지로 협정세율을 받는 법

  # 수출과 대금
  - name: 수출 신고
    parent: 무역 거래
    aliases: [수출신고, 수출신고필증, 수출면장, 수출신고수리, 적재 기한, export declaration]
    description: 수출신고 수리 뒤 정해진 기간(원칙 30일) 안에 선적해야 하고, 넘기면 수리가 취소될 수 있는 절차

  - name: 무역 대금 결제
    parent: 무역 거래
    aliases: [T/T, 전신송금, 신용장, L/C, Letter of Credit, D/P, D/A, 추심 결제, UCP 600, 선적서류]
    description: 송금·신용장·추심 방식이 수출자와 수입자의 대금 위험을 어떻게 나누는지

  - name: 환율
    parent: 무역 거래
    aliases: [환율 고시, 매매기준율, 전신환매도율, 전신환매입률, TTS, TTB, 현찰 환율, 과세환율, exchange rate]
    description: 은행이 고시하는 매매기준율과 살 때·팔 때 환율, 관세 과세환율, 어느 시점의 환율을 적용하는지
    related: [외화 거래와 환산]

  - name: 수입 원가
    parent: 무역 거래
    aliases: [도착 원가, landed cost, 수입 부대비용, 수입 원가 계산, 부대비용 배부, 수입 정산]
    description: 물품대에 운임·보험료·관세·통관 부대비용을 더한 도착 원가. 수입 부가세는 매입세액이라 원가에 넣지 않는다
    requires: [인코텀즈, 관세와 품목분류]
    related: [미착품, 부가가치세]

  # 외국환거래
  - name: 외국환거래 신고
    parent: 무역 거래
    aliases: [외국환거래법, 외환 신고, 자본거래 신고, 사전신고, 사후보고, 지정거래외국환은행]
    description: 외국환거래법이 거래 유형에 따라 사전신고·사후보고와 신고 기관(외국환은행·한국은행 등)을 정하는 구조

  - name: 해외직접투자
    parent: 외국환거래 신고
    aliases: [해외직접투자 신고, overseas direct investment, ODI, 해외 현지법인 투자, 해외직접투자 사후관리]
    description: 외국법인 지분을 10% 이상 취득하는 등 경영에 참여하는 투자의 사전 신고와 투자 뒤 보고 의무
    requires: [외국환거래 신고]

  - name: 해외 금전대차와 증권취득 신고
    parent: 외국환거래 신고
    aliases: [해외 금전대차, 금전대차 신고, 해외 차입, 해외 대출, 외화 차입, 해외 증권취득, 증권취득 신고]
    description: 비거주자와 돈을 빌려주고 빌리거나 외국 증권을 취득하는 자본거래의 신고 대상과 신고 기관
    requires: [외국환거래 신고]
