# 시드 개념: 무역·외환 (ADR-0042). 형식은 accounting.yaml 머리말

track:
  key: trade
  name: 무역·외환
  weight: 0.2
  description: 인코텀즈, B/L·선적 일정, 수입 통관·보세구역·검역, 관세·HS 코드, 수출 신고, 무역 대금 결제, 환율, 수입 원가, 외국환거래 신고

concepts:
