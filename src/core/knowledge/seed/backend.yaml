# 시드 개념: 백엔드 (ADR-0021). 형식은 cs.yaml 머리말을 따른다.

track:
  key: backend
  name: 백엔드
  weight: 0.3
  description: 애플리케이션. Spring·NestJS, JPA, 캐시, API·데이터 모델링, DB 사용(쿼리·인덱스·마이그레이션), 배치, 테스트

concepts:
  # 의존성 주입과 프레임워크
  - name: 의존성 주입
    aliases: [DI, dependency injection, IoC, 제어의 역전, inversion of control]
    description: 객체가 협력 객체를 직접 만들지 않고 밖에서 받는 구조. 테스트에서 바꿔 끼울 수 있다

  - name: IoC 컨테이너와 빈 생명주기
    parent: 의존성 주입
    aliases:
      [
        ApplicationContext,
        Spring bean,
        빈,
        bean scope,
        component scan,
        싱글톤 빈,
        빈 후보 선택,
        '@Primary',
        '@Qualifier',
        NoUniqueBeanDefinitionException,
        NoSuchBeanDefinitionException,
        순환 참조,
      ]
    description: 컨테이너가 객체를 만들고 연결하고 초기화하는 순서, 빈 스코프, 주입 대상이 없거나 여럿일 때의 기동 오류

  - name: 포트와 어댑터
    parent: 의존성 주입
    aliases: [hexagonal architecture, 헥사고날, DIP, 의존관계 역전 원칙, port, adapter]
    description: 유스케이스가 외부 기술이 아니라 추상(포트)에 의존하게 해 경계를 바꿔 끼우는 구조

  - name: NestJS 모듈 시스템
    parent: 의존성 주입
    aliases:
      [
        NestJS module,
        imports,
        exports,
        providers,
        '@Global',
        동적 모듈,
        forRoot,
        NestJS provider 탐색,
        DiscoveryService,
        데코레이터 메타데이터,
        custom decorator,
      ]
    description: 모듈이 provider를 만들어 내놓고 다른 모듈이 import해 쓰는 구조. exports는 주입 범위만 정하고, 데코레이터 탐색은 모든 provider를 훑는다

  - name: AOP와 프록시
    aliases: [AOP, aspect, proxy, JDK dynamic proxy, CGLIB, 관점 지향, 공통 관심사]
    description: 트랜잭션·캐시·보안 같은 공통 기능을 프록시가 메서드 앞뒤에 끼워 넣는 방식
    requires: [의존성 주입]

  - name: 프록시 자기 호출 함정
    parent: AOP와 프록시
    aliases: [self-invocation, this 호출, 프록시 우회]
    description: 같은 클래스 안에서 부르면 프록시를 거치지 않아 @Transactional·@Cacheable·@PreAuthorize가 조용히 꺼진다

  # 트랜잭션
  - name: 선언적 트랜잭션
    aliases: ['@Transactional', declarative transaction, TransactionTemplate]
    description: 프록시가 메서드를 트랜잭션 시작·커밋·롤백으로 감싸는 방식
    requires: [AOP와 프록시, 트랜잭션과 ACID]

  - name: 트랜잭션 롤백 규칙
    parent: 선언적 트랜잭션
    aliases: [rollbackFor, checked exception, unchecked exception, setRollbackOnly]
    description: 기본은 언체크 예외만 롤백한다. 체크 예외나 삼킨 예외는 커밋된다

  - name: 트랜잭션 전파
    parent: 선언적 트랜잭션
    aliases: [propagation, REQUIRED, REQUIRES_NEW, UnexpectedRollbackException, rollback-only]
    description: 진행 중인 트랜잭션에 합류할지 새로 열지. 합류한 안쪽의 롤백이 바깥까지 죽인다

  - name: 읽기 전용 트랜잭션
    parent: 선언적 트랜잭션
    aliases: [readOnly, '@Transactional(readOnly = true)']
    description: flush를 생략하는 대신, 클래스가 readOnly인데 메서드에서 덮어쓰지 않으면 변경이 조용히 사라진다

  - name: 트랜잭션 범위 설계
    parent: 선언적 트랜잭션
    aliases: [트랜잭션 경계, 외부 호출, '@TransactionalEventListener', AFTER_COMMIT, 애그리거트]
    description: 함께 바뀌어야 할 쓰기를 한 트랜잭션에 묶고, 외부 호출은 트랜잭션 밖으로 빼는 기준

  # JPA
  - name: JPA와 Hibernate
    aliases:
      [
        JPA,
        Hibernate,
        ORM,
        Spring Data JPA,
        JdbcTemplate과 네이티브 SQL,
        JdbcTemplate,
        native query,
        '@Query',
        JPQL,
        QueryDSL,
        텍스트 블록,
      ]
    description: 객체와 테이블을 매핑하는 명세와 구현, 편의 계층. 앱이 소유하지 않는 테이블이나 복잡한 집계는 SQL로 직접 읽는다
    requires: [SQL 쿼리 실무]

  - name: 영속성 컨텍스트
    parent: JPA와 Hibernate
    aliases: [persistence context, 1차 캐시, entity lifecycle, 엔티티 생명주기]
    description: 트랜잭션 동안 엔티티를 보관하며 변경을 지켜보는 저장소
    requires: [선언적 트랜잭션]

  - name: 변경 감지와 준영속
    parent: JPA와 Hibernate
    aliases: [dirty checking, detached, flush, 쓰기 지연, write-behind]
    description: save 없이도 커밋 때 바뀐 필드를 UPDATE한다. 트랜잭션 밖의 준영속 엔티티는 감지되지 않는다
    requires: [영속성 컨텍스트]

  - name: 지연 로딩과 N+1
    parent: JPA와 Hibernate
    aliases: [lazy loading, LazyInitializationException, N+1, fetch join, EntityGraph, batch fetch size]
    description: 연관을 건드릴 때마다 쿼리가 나가 목록 1번 + N번이 된다. 조인이나 배치 크기로 줄인다
    requires: [영속성 컨텍스트]

  - name: 엔티티와 DTO 분리
    parent: JPA와 Hibernate
    aliases: [DTO, DTO projection, API 응답 모델]
    description: 엔티티를 그대로 응답하면 스키마 결합, 민감정보 노출, 직렬화 예외가 생긴다

  - name: ddl-auto와 스키마 자동 생성
    parent: JPA와 Hibernate
    aliases: [ddl-auto, hbm2ddl, 'ddl-auto=update', validate]
    description: update는 추가만 하고 NOT NULL 완화·삭제·이름 변경·인덱스는 하지 않으며 실패해도 기동한다. 운영은 마이그레이션 도구로
    related: [스키마 마이그레이션]

  - name: 컬럼 타입 매핑
    parent: JPA와 Hibernate
    aliases: [BigDecimal, 'numeric(38,2)', numeric precision, 타입 매핑]
    description: 정밀도를 지정하지 않은 BigDecimal이 소수 2자리로 잘리는 것처럼, 매핑 기본값이 데이터를 바꾸는 경우
    requires: [부동소수점]

  # 웹 계층
  - name: Spring MVC 요청 처리
    aliases:
      [
        Spring MVC,
        DispatcherServlet,
        HandlerMapping,
        HttpMessageConverter,
        ArgumentResolver,
        계층형 아키텍처,
        layered architecture,
        Controller,
        Service,
        Repository,
        관심사 분리,
      ]
    description: 요청이 필터와 디스패처, 핸들러, 변환기를 거쳐 응답이 되는 경로와 컨트롤러·서비스·저장소 계층의 역할
    requires: [HTTP]

  - name: 요청 검증과 전역 예외 처리
    parent: Spring MVC 요청 처리
    aliases: ['@Valid', Bean Validation, '@RestControllerAdvice', '@ExceptionHandler', 예외 번역, DataAccessException]
    description: 검증 실패와 도메인 예외를 일관된 오류 응답과 상태 코드로 바꾸는 방법

  - name: 필터와 인터셉터
    parent: Spring MVC 요청 처리
    aliases: [Servlet Filter, HandlerInterceptor, 필터 vs 인터셉터 vs AOP]
    description: 끼어드는 층이 서블릿 앞, 핸들러 앞, 메서드 앞으로 다르다
    related: [AOP와 프록시]

  - name: 요청당 스레드 모델
    parent: Spring MVC 요청 처리
    aliases: [thread-per-request, Tomcat thread pool, 가상 스레드, virtual thread, WebFlux]
    description: 스레드 하나가 요청 하나를 끝까지 처리해 느린 작업이 처리량을 깎는 구조. 이벤트 루프와 대비된다
    requires: [프로세스와 스레드]
    related: [이벤트 루프]

  - name: JSON 직렬화와 네이밍 전략
    parent: Spring MVC 요청 처리
    aliases: [Jackson, ObjectMapper, SNAKE_CASE, camelCase, springdoc, '@JsonProperty']
    description: 전역 네이밍 전략이 응답 키를 바꾸고, 생성된 API 스펙이 실제 응답과 어긋날 수 있다

  # 설정과 기동
  - name: 애플리케이션 설정과 기동
    aliases:
      [
        Spring Boot configuration,
        application.yml,
        프로파일,
        profile,
        다중 데이터소스,
        multiple DataSource,
        secondary DataSource,
        defaultCandidate,
        보조 DB,
        예약 작업,
        '@Scheduled',
        cron,
        fixedDelay,
        initialDelay,
        scheduler,
      ]
    description: 환경별 설정, 보조 데이터소스, 기동 순서와 기동 시점 작업, 주기 작업
    related: [빌드 타임 설정과 런타임 설정]

  - name: 프로파일과 외부 설정
    parent: 애플리케이션 설정과 기동
    aliases: [spring.profiles.active, '@Value', '@Profile', relaxed binding]
    description: 환경마다 설정을 덧씌우는 방법. 프로파일로 막는 것보다 실행 환경의 능력을 직접 묻는 편이 안전할 때가 있다

  - name: 기동 시점 작업
    parent: 애플리케이션 설정과 기동
    aliases: [ApplicationRunner, ApplicationReadyEvent, '@Async', '@PostConstruct', 부팅 작업]
    description: 무거운 초기화를 언제 어느 스레드에서 돌릴지. 기동 실패와 준비 지연을 피한다

  - name: 헬스 체크와 준비 상태
    parent: 애플리케이션 설정과 기동
    aliases: [Actuator, health, readiness, liveness, readiness probe]
    description: 전체 health는 외부 의존까지 합산한다. 배포 판정에는 준비 상태만 써야 한다

  # 인증·인가
  - name: 인증과 인가
    aliases:
      [
        authentication,
        authorization,
        AuthN,
        AuthZ,
        401 vs 403,
        비밀번호 저장,
        password hashing,
        BCrypt,
        salt,
        PasswordEncoder,
      ]
    description: 신원 확인과 권한 확인의 구분, 각각의 실패 응답, 비밀번호를 솔트 넣은 느린 해시로 저장하기
    requires: [HTTP 상태 코드]

  - name: Spring Security 필터 체인
    parent: 인증과 인가
    aliases:
      [
        SecurityFilterChain,
        requestMatchers,
        authorizeHttpRequests,
        SecurityContext,
        매처 순서,
        메서드 보안,
        '@PreAuthorize',
        '@PostAuthorize',
        method security,
      ]
    description: 디스패처 앞 필터 줄에서 인증·인가를 처리한다. 경로 규칙은 먼저 맞은 것이 이기고, 메서드 보안은 프록시로 동작한다
    requires: [AOP와 프록시]

  - name: 세션 인증과 토큰 인증
    parent: 인증과 인가
    aliases: [session, JWT, access token, refresh token, stateless, JSESSIONID]
    description: 상태를 서버가 갖는지 클라이언트가 갖는지. 확장성과 강제 로그아웃의 맞교환. JWT 내용은 암호화가 아니다

  - name: 객체 단위 권한 검사
    parent: 인증과 인가
    aliases: [IDOR, object-level authorization, 소유자 검사]
    description: 기능 권한만 보고 대상 객체의 소유자를 확인하지 않으면 남의 데이터를 읽고 지울 수 있다

  # 캐시
  - name: 서버 캐시
    aliases: [server-side cache, application cache, 로컬 캐시, in-memory cache]
    description: 조회 결과를 메모리에 두고 재사용하는 방법과 신선도 관리
    related: [HTTP 캐싱]

  - name: 캐시 추상화
    parent: 서버 캐시
    aliases: ['@Cacheable', '@CacheEvict', CacheManager, Caffeine, cache-names]
    description: 프록시가 메서드 결과를 캐시한다. 등록 방식에 따라 모르는 캐시 이름을 거부하기도 한다
    requires: [AOP와 프록시]

  - name: 캐시 무효화 전략
    parent: 서버 캐시
    aliases: [TTL, cache invalidation, evict and warm, 스케줄 갱신, 캐시 예열, warming]
    description: 시간으로 버릴지, 데이터가 바뀌는 시점에 버리고 바로 채울지. 근거 없는 TTL은 낡은 값을 보여 준다

  - name: 변경 감지로 갱신
    parent: 서버 캐시
    aliases: [change detection, polling, 워터마크, watermark, 'MAX(updated_at)', 제자리 UPDATE]
    description: 싼 쿼리로 "바뀌었나"만 묻고 바뀌었을 때만 다시 읽는다. 행 수와 최대 ID는 기존 행의 UPDATE를 놓친다

  - name: 캐시 스탬피드
    parent: 서버 캐시
    aliases: [cache stampede, thundering herd, 'sync = true', 동시 미스]
    description: 캐시가 비었을 때 동시 요청이 모두 원천을 치는 현상. 미스를 하나로 합친다

  - name: 캐시와 트랜잭션 경쟁
    parent: 서버 캐시
    aliases: [evict race, 커밋 전 evict, stale fill]
    description: 커밋 전에 비우면 다른 요청이 옛 데이터로 다시 채운다. 커밋 뒤에 비운다
    requires: [선언적 트랜잭션]

  - name: 커넥션 풀
    aliases: [connection pool, HikariCP, pool exhaustion, hikari connection-timeout, CannotGetJdbcConnectionException]
    description: DB 연결을 재사용하는 풀의 상한과 대기 시간. 오래 붙잡는 조회가 다른 요청을 실패시킨다

  # Java
  - name: Java 실무 함정
    aliases:
      [
        Java,
        JVM,
        Java 21,
        박싱 타입과 캐스팅,
        Integer,
        Long,
        ClassCastException,
        boxing,
        Number.longValue,
        정적 초기화 실패,
        static initializer,
        ExceptionInInitializerError,
        NoClassDefFoundError,
      ]
    description: 업무 코드에서 만난 언어·라이브러리 수준의 함정. 박싱 타입끼리의 캐스팅, 정적 초기화 실패의 연쇄 등

  - name: 날짜·시간과 타임존
    parent: Java 실무 함정
    aliases: [java.time, ZoneId, LocalDate.now, DateTimeFormatter, STRICT, uuuu, KST, 타임존]
    description: 기본 타임존에 기대면 "오늘"이 하루 어긋나고, 관대한 파서는 없는 날짜를 조용히 보정한다

  - name: 스레드 안전성
    parent: Java 실무 함정
    aliases: [thread safety, ThreadLocal, 공유 객체, 불변 객체]
    description: 스레드 안전하지 않은 객체를 공유하는 범위와, 스레드 풀에서 ThreadLocal을 비우지 않는 문제
    requires: [프로세스와 스레드]

  # SQL
  - name: SQL 쿼리 실무
    aliases:
      [
        SQL,
        PostgreSQL,
        쿼리 튜닝,
        LATERAL 조인,
        LATERAL JOIN,
        CROSS JOIN LATERAL,
        행별 서브쿼리,
        unnest WITH ORDINALITY,
        조건부 집계,
        FILTER,
        COUNT(*) FILTER,
        SUM(CASE WHEN),
        COUNT DISTINCT 성능,
        UPSERT,
        INSERT ON CONFLICT,
        MERGE 문,
        최초값 보존,
      ]
    description: 실무 쿼리 패턴(LATERAL, 조건부 집계, UPSERT), 실행계획, 인덱스 설계와 함정
    requires: [인덱스 원리]

  - name: 실행계획 읽기
    parent: SQL 쿼리 실무
    aliases: [EXPLAIN, EXPLAIN ANALYZE, query plan, BUFFERS]
    description: 인덱스를 탔는지, 추정 행과 실제 행이 얼마나 다른지, 정렬·해시가 어디서 도는지 확인한다
    requires: [선택도와 스캔 방식]

  - name: 복합 인덱스 설계
    parent: SQL 쿼리 실무
    aliases: [composite index, leftmost prefix, 선두 컬럼, CREATE INDEX CONCURRENTLY]
    description: 등호 컬럼을 앞에 두고 선두 컬럼 조건이 있어야 쓰인다. 운영 테이블에는 잠금 없이 만든다
    requires: [B-tree 인덱스]

  - name: 부분 인덱스와 부분 유니크
    parent: SQL 쿼리 실무
    aliases: [partial index, partial unique index, 조건부 유일성, soft delete]
    description: 조건에 맞는 행만 담는다. 상태가 특정 값인 행만 하나로 제한할 때 쓰고, ORM 애너테이션으로는 표현하지 못한다
    requires: [B-tree 인덱스]

  - name: 윈도 함수
    parent: SQL 쿼리 실무
    aliases: [window function, ROW_NUMBER, PARTITION BY, 최신 행 고르기]
    description: 키별 최신 행을 고르거나 그룹 안에서 순위를 매긴다

  - name: NULL 안전 비교
    parent: SQL 쿼리 실무
    aliases: [IS DISTINCT FROM, COALESCE, NOT IN NULL]
    description: NULL이 섞인 비교·집계가 행을 조용히 빼거나 범위를 어긋나게 하는 것을 막는다
    requires: [SQL NULL과 3값 논리]

  - name: 제약 조건 설계
    parent: SQL 쿼리 실무
    aliases: [FK, UNIQUE, CHECK, NOT NULL, foreign key, 제약 위반 409]
    description: 앱 검증 위에 DB 제약을 최후 방어선으로 두고, 값을 맞바꿀 때의 쓰기 순서를 정한다
    requires: [확인 후 실행 경쟁]

  - name: 문자열 비교 함정
    parent: SQL 쿼리 실무
    aliases: [사전순 비교, lexicographic, bpchar, 공백 패딩, TRIM, 문자열 날짜]
    description: 문자열 날짜의 사전순 비교, 고정길이 패딩 때문에 조인이 전부 실패하는 문제

  # 마이그레이션
  - name: 스키마 마이그레이션
    aliases:
      [schema migration, DDL, 마이그레이션, 마이그레이션 도구, Flyway, Liquibase, drizzle-kit, 버전 관리형 마이그레이션]
    description: 운영 스키마를 버전 관리된 스크립트로 안전하게 바꾸는 방법. 테이블 이름을 바꿔도 인덱스·제약 이름은 따라오지 않는다

  - name: 확장-축소 마이그레이션
    parent: 스키마 마이그레이션
    aliases: [expand-contract, parallel change, 무중단 스키마 변경]
    description: 새 구조를 더하고, 코드를 옮기고, 옛 구조를 지우는 순서로 나눠 구버전과 신버전이 함께 돌게 한다

  - name: 마이그레이션 배포 순서
    parent: 스키마 마이그레이션
    aliases: [deploy order, 추가는 배포 전, 삭제는 배포 후, backfill-first]
    description: 컬럼 추가와 제약 완화는 배포 전, 삭제는 배포 후. 백필보다 배포가 먼저면 빈 값이 캐시된다
    requires: [확장-축소 마이그레이션]

  - name: 운영 데이터 변경 절차
    parent: 스키마 마이그레이션
    aliases: [runbook, 런북, rehearsal, 리허설, 백필, backfill, 표적 롤백]
    description: 복원 DB에서 리허설하고, 백업하고, 되돌릴 표식을 남기고, 멱등하게 다시 돌릴 수 있게 한다
    requires: [멱등성]

  # PostGIS
  - name: PostGIS 공간 쿼리
    aliases:
      [
        PostGIS,
        spatial SQL,
        ST_ 함수,
        geometry,
        거리 질의,
        ST_DWithin,
        KNN,
        <->,
        nearest neighbor,
        반경 질의,
        도형 표현과 유효성,
        GeoJSON,
        WKT,
        MultiPolygon,
        ST_MakeValid,
        self-intersection,
        육각 격자,
      ]
    description: PostgreSQL 안에서 도형 타입과 공간 함수, 공간 인덱스로 공간 질문을 푼다. 거리 질의, 도형 표현과 무효 도형 고치기 포함
    requires: [좌표계와 투영]

  - name: 공간 포함 판정
    parent: PostGIS 공간 쿼리
    aliases: [ST_Covers, ST_Contains, ST_Intersects, boundary semantics]
    description: Contains는 경계 위의 점을 빼고 Covers는 포함한다. 변을 공유하는 격자에서는 Covers를 쓴다
    requires: [점-다각형 포함 판정]

  - name: 공간 인덱스 활용
    parent: PostGIS 공간 쿼리
    aliases: ['&&', ST_Expand, bbox 프리필터, GiST 인덱스]
    description: 컬럼을 함수로 감싸지 않고 경계 상자 연산자로 후보를 좁힌 뒤 정밀 판정한다
    requires: [공간 인덱스, 경계 상자 사전 거절]

  - name: SRID와 좌표 변환
    parent: PostGIS 공간 쿼리
    aliases: [SRID, ST_Transform, ST_SetSRID, 좌표 변환]
    description: 비교하는 두 도형의 좌표계가 다르면 오류 없이 0건이 나온다

  # 데이터 모델링
  - name: 데이터 모델링
    aliases: [data modeling, 테이블 설계, 스키마 설계, EAV 모델, entity-attribute-value, 속성 행, pivot]
    description: 무엇을 어떤 테이블과 상태로 저장할지 정하는 설계. 속성을 행으로 두는 EAV 같은 구조 포함
    requires: [정규화와 함수 종속]

  - name: 이력 테이블
    parent: 데이터 모델링
    aliases: [revision table, SCD2, append-only, 회차, history table]
    description: 변경할 때 행을 덧붙이고 최신 회차를 고르는 구조. 회차 번호는 시각이 아니다

  - name: 상태 모델링
    parent: 데이터 모델링
    aliases: [state enum, 상태 컬럼, boolean vs enum, PENDING APPROVED REJECTED]
    description: 참·거짓 대신 이름 붙은 상태로 표현하고, 판정 술어를 상태 타입 안에 모은다

  - name: 단일 진실 공급원
    parent: 데이터 모델링
    aliases: [single source of truth, SSOT, 파생 뷰, derived view, 사본 드리프트]
    description: 같은 사실을 두 곳에 적지 않는다. 사본은 갱신 장치가 없으면 조용히 갈라진다

  - name: 저장값과 계산값
    parent: 데이터 모델링
    aliases: [stored vs computed, 재계산, recompute, 계산 결과 저장]
    description: 판정 규칙을 바꾸면 그 규칙으로 저장해 둔 값도 다시 계산해야 한다
    requires: [단일 진실 공급원]

  - name: 모름과 없음의 구분
    parent: 데이터 모델링
    aliases: [null vs 0, unknown vs zero, 결측, 빈 집합, missing value]
    description: 세지 못한 것(null)과 세었는데 없는 것(0)을 섞으면 장애가 정상처럼 보인다
    requires: [SQL NULL과 3값 논리]

  - name: 값의 단위 계약
    parent: 데이터 모델링
    aliases: [단위, 단위 불일치, 월 vs 연, 퍼센트 vs 비율, 만원 vs 원, 스케일]
    description: 같은 이름의 값이 단위가 달라 생기는 조용한 몇 배 오류. 변환 책임을 한 곳에 둔다

  - name: 허용 목록과 제외 목록
    parent: 데이터 모델링
    aliases: [allowlist, denylist, fail-closed, 새 값 처리, 손실 있는 상태 매핑]
    description: 값이 늘어날 수 있으면 무엇을 기본으로 막을지, 상태를 접을 때 원본을 남길지 정한다

  # 데이터 통합·배치
  - name: 데이터 통합과 배치
    aliases:
      [
        ETL,
        ELT,
        batch,
        데이터 파이프라인,
        data pipeline,
        원자적 전량 교체,
        full refresh,
        DELETE INSERT,
        세대 교체,
        swap,
        snapshot replace,
      ]
    description: 여러 원천의 데이터를 모으고 미리 계산해 두는 배치 설계. 한 트랜잭션으로 통째로 바꾸는 전량 교체 포함
    requires: [트랜잭션과 ACID]

  - name: 사전집계와 데이터 마트
    parent: 데이터 통합과 배치
    aliases: [pre-aggregation, summary table, data mart, ODS, materialized view, 마트]
    description: 무거운 원장을 미리 집계해 두고 작은 표를 읽는다. 같은 숫자를 두 곳에서 만들지 않는다
    requires: [집계의 가산성]

  - name: 멱등성
    parent: 데이터 통합과 배치
    aliases:
      [
        idempotency,
        idempotent,
        IF NOT EXISTS,
        다시 돌려도 같은 결과,
        멱등 API,
        idempotent PUT,
        idempotency key,
        ensure 연산,
      ]
    description: 같은 작업이나 요청을 반복해도 결과가 한 번 한 것과 같게 만든다. 배치와 API 모두에 해당한다

  - name: 증분 처리
    parent: 데이터 통합과 배치
    aliases:
      [incremental processing, 증분 동기화, baseline, 기준선, high-water mark, 늦게 도착하는 데이터, late-arriving data]
    description: 마지막으로 본 지점 이후만 처리한다. 처음에는 기준선을 깔고, 늦게 오는 데이터는 최근 구간을 다시 본다
    requires: [멱등성]

  - name: 교차 원천 병합
    parent: 데이터 통합과 배치
    aliases: [cross-database merge, left merge, 매치율, record linkage, entity resolution, 레코드 매칭]
    description: 다른 DB끼리는 SQL로 조인할 수 없어 앱에서 키로 합친다. 키 형식을 맞추고 매치율을 기록한다

  - name: 모수와 기준 시점
    parent: 데이터 통합과 배치
    aliases: [population, 모수, as-of, 기준일, 필터 위치, 집계 정합성]
    description: 부분값을 전체와 같은 모수·같은 시점으로 세야 차감이 음수가 되지 않는다
    related: [비율 지표 설계]

  - name: 데이터 품질 검증
    parent: 데이터 통합과 배치
    aliases: [data quality, sentinel value, 센티넬, '99991231', 이상값, 커버리지 확인]
    description: 믿을 수 없는 값을 규칙으로 걸러 "미상"으로 보내고, 옮기기 전에 기간·행 수를 원천과 대조한다

  - name: 부분 실패 격리
    parent: 데이터 통합과 배치
    aliases: [fail-soft, graceful degradation, failure isolation, 연속 실패 한도, circuit breaker]
    description: 부가 원천이 실패해도 본체는 진행하고 그 값만 비운다. 실패한 결과가 정상 값을 덮지 않게 한다

  # API·서비스 설계
  - name: API 설계
    aliases:
      [
        API design,
        API 계약,
        contract,
        조회 범위 설계,
        pagination,
        페이지네이션,
        bbox 조회,
        뷰포트 조회,
        전량 로드,
        서버 측 집계,
        server-side aggregation,
        집계 책임,
        shared query,
      ]
    description: 응답의 모양, 요청 수, 식별자, 하위 호환. 조회 범위(전량·페이지·화면 범위)와 집계를 서버와 클라이언트 중 어디서 할지
    requires: [REST API 설계 원칙]

  - name: 식별자와 표시 라벨 분리
    parent: API 설계
    aliases: [stable identifier, enum name, 표시명, label]
    description: 서버는 안정된 식별자만 내리고 표시명은 화면이 소유한다. 같은 코드를 두 계층이 다르게 읽는 사고를 막는다

  - name: 하위 호환 변경
    parent: API 설계
    aliases: [backward compatibility, deploy skew, 배포 스큐, 필드 추가]
    description: 필드는 더하기만 하고 서버를 먼저 배포한다. 클라이언트는 없는 필드를 견딘다

  - name: 목록과 상세 분리
    parent: API 설계
    aliases: [over-fetching, payload diet, 슬림 목록, list detail split, 페이로드 다이어트]
    description: 목록에는 그리는 데 필요한 필드만 두고 상세는 필요할 때 따로 받는다

  - name: 서비스 설계
    aliases: [service layer, 서비스 계층, 유스케이스, 단일 진입점, single entry point, 서비스 의존 방향]
    description: 서비스 사이의 책임과 의존 방향. 같은 결과를 내는 경로를 하나로 모은다

  - name: 판정 기준 공유
    parent: 서비스 설계
    aliases: [shared predicate, 자격 기준, eligibility]
    description: 여러 화면·경로가 같은 대상 판정을 한 곳에서 가져와야 서로 어긋나지 않는다

  - name: 재사용 함수의 숨은 전제
    parent: 서비스 설계
    aliases: [hidden precondition, 암묵적 전제, 방어 분기]
    description: 다른 곳의 필터를 전제로 짠 분기가 새 경로에서는 틀린 값을 낸다

  - name: 조용한 실패
    parent: 서비스 설계
    aliases: [silent failure, false success, 실패 위장, 삼킨 예외]
    description: 실패를 빈 결과나 성공으로 바꾸면 아무도 모른다. 읽기는 방어하고 쓰기는 오류를 드러낸다

  # 테스트
  - name: 테스트 전략
    aliases: [testing, 테스트, unit test, 테스트 피라미드, 순수 로직 분리, pure function, functional core, 순수 함수]
    description: 무엇을 얼마나 띄워 검증할지 고르는 기준. 판정 규칙을 순수 함수로 빼 빠르게 테스트한다
    related: [포트와 어댑터]

  - name: 실제 DB 통합 테스트
    parent: 테스트 전략
    aliases: [Testcontainers, integration test, 슬라이스 테스트, '@DataJpaTest', '@WebMvcTest']
    description: 실제 DB로 커밋·롤백·제약·SQL을 검증한다. 외부 경계 하나만 바꿔 끼운다

  - name: 목 객체의 한계
    parent: 테스트 전략
    aliases: [mock, Mockito, mock blind spot, 테스트 더블, fake, stub]
    description: 목은 "호출됐다"까지만 안다. SQL 오류나 직렬화 경계는 운영에서야 드러난다

  - name: 테스트 오라클
    parent: 테스트 전략
    aliases: [test oracle, 동어반복 테스트, tautological test, RED 먼저, 실패 확인]
    description: 기대값을 구현과 같은 계산에서 가져오면 회귀를 못 잡는다. 고친 줄을 되돌리면 실패하는지 확인한다

  # 기타
  - name: 파일 업로드와 오브젝트 스토리지
    aliases: [file upload, multipart, S3, presigned URL, 오브젝트 스토리지, 고아 객체]
    description: 업로드 크기 상한, 바이너리와 메타데이터의 분리 저장, 서빙 방식의 맞교환

  - name: Git 이력 관리
    aliases: [git, 버전 관리]
    description: 브랜치 통합, 되돌리기, 공유 이력 다루기

  - name: 병합·리베이스·체리픽
    parent: Git 이력 관리
    aliases: [merge, rebase, cherry-pick, pull.rebase, fast-forward]
    description: 중간 상태끼리 비교하는 방식과 최종본끼리 비교하는 방식의 충돌 비용 차이

  - name: 되돌리기와 복구
    parent: Git 이력 관리
    aliases:
      [
        revert,
        reset,
        abort,
        MERGE_HEAD,
        orig-head,
        reflog,
        공유 이력 재작성,
        commit --amend,
        force push,
        히스토리 재작성,
        worktree,
      ]
    description: 공유된 이력은 되돌림 커밋으로 고치고(이미 공유한 커밋은 다시 쓰지 않는다), 진행 중인 병합·리베이스는 abort로 원위치한다
