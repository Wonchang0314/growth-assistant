# 시드 개념: 백엔드 (ADR-0022). 형식은 js.yaml 머리말

track:
  key: backend
  name: 백엔드
  weight: 0.2
  description: 지금 쓰는 NestJS와 앞으로 자주 만날 Spring의 작동 방식과 사용법, 두 프레임워크에 공통인 서버 설계

concepts:
  # 공통
  - name: 서버 애플리케이션 설계
    aliases: [백엔드 설계, 웹 프레임워크, 서버 프레임워크, backend]
    description: 프레임워크와 상관없이 서버 코드를 나누고 요청을 처리하는 원리

  - name: 의존성 주입과 IoC
    parent: 서버 애플리케이션 설계
    aliases: [DI, dependency injection, 의존성 주입, IoC, 제어의 역전, inversion of control, IoC 컨테이너, DI 컨테이너]
    description: 객체를 직접 만들지 않고 컨테이너가 만들어 넣어 주는 구조와 그 이점

  - name: 계층 구조와 포트·어댑터
    parent: 서버 애플리케이션 설계
    aliases:
      [
        레이어드 아키텍처,
        layered architecture,
        헥사고날 아키텍처,
        hexagonal architecture,
        포트와 어댑터,
        클린 아키텍처,
        의존 방향,
      ]
    description: 컨트롤러·서비스·저장소로 나누는 이유와, 바깥 기술을 포트 뒤로 숨기는 구조
    requires: [의존성 주입과 IoC]

  - name: 동시 요청 처리 모델
    parent: 서버 애플리케이션 설계
    aliases:
      [
        요청당 스레드,
        thread per request,
        블로킹 I/O,
        논블로킹 I/O,
        non-blocking I/O,
        이벤트 루프 서버,
        가상 스레드,
        virtual thread,
      ]
    description: 스레드 풀로 요청을 나눠 받는 방식(Spring MVC)과 이벤트 루프 하나로 받는 방식(Node)의 차이
    requires: [이벤트 루프, 프로세스와 스레드]

  - name: 요청 처리 파이프라인
    parent: 서버 애플리케이션 설계
    aliases: [미들웨어, middleware, 요청 생명주기, request lifecycle, 횡단 관심사]
    description: 요청이 컨트롤러에 닿기 전후로 거치는 단계와 각 단계에 둘 일

  - name: 입력 검증과 예외 처리
    parent: 서버 애플리케이션 설계
    aliases: [validation, 입력 검증, 요청 검증, DTO 검증, 전역 예외 처리, 예외 응답 형식, 에러 응답]
    description: 요청을 경계에서 검증하는 법과 예외를 일관된 응답으로 바꾸는 법
    related: [타입 단언과 런타임 검증]

  - name: REST API 설계
    parent: 서버 애플리케이션 설계
    aliases: [REST, RESTful, API 설계, 리소스 설계, 하위 호환, API 버전 관리, OpenAPI, Swagger]
    description: 리소스와 메서드로 API를 설계하고 바꿔도 클라이언트가 깨지지 않게 하는 법
    requires: [HTTP 메시지와 메서드]
    related: [HTTP 상태 코드]

  - name: 인증과 인가
    parent: 서버 애플리케이션 설계
    aliases: [authentication, authorization, 인증, 인가, 세션 인증, 토큰 인증, JWT, OAuth, OAuth 2.0, 접근 제어]
    description: 누구인지 확인하는 일과 무엇을 할 수 있는지 정하는 일, 세션과 토큰 방식의 차이
    requires: [쿠키와 세션]

  - name: 트랜잭션 관리
    parent: 서버 애플리케이션 설계
    aliases:
      ['@Transactional', 선언적 트랜잭션, 트랜잭션 경계, 트랜잭션 전파, propagation, 롤백 규칙, 읽기 전용 트랜잭션]
    description: 애플리케이션 코드에서 트랜잭션 경계를 정하는 법과 전파·롤백 규칙
    requires: [트랜잭션과 ACID]
    related: [AOP와 프록시]

  - name: ORM과 SQL 매핑
    parent: 서버 애플리케이션 설계
    aliases: [ORM, 객체-관계 매핑, object-relational mapping, 쿼리 빌더, query builder, Drizzle, TypeORM, Prisma]
    description: 객체와 테이블 사이의 불일치, ORM과 쿼리 빌더의 차이와 고르는 기준
    requires: [SQL 쿼리]

  - name: 서버 캐시
    parent: 서버 애플리케이션 설계
    aliases: [cache, 캐시, Redis, 레디스, 캐시 무효화, 캐시 스탬피드, cache-aside, 로컬 캐시]
    description: 서버에서 결과를 캐시하는 위치와 전략, 무효화와 스탬피드 문제
    related: [HTTP 캐싱]

  - name: 멱등성과 재시도
    parent: 서버 애플리케이션 설계
    aliases: [idempotency, 멱등성, 멱등, 재시도, retry, 멱등 키, idempotency key, 중복 요청]
    description: 같은 요청이 여러 번 와도 결과가 같게 만드는 법과 안전하게 재시도하는 조건
    related: [HTTP 메시지와 메서드, 갱신 경쟁]

  - name: 테스트 전략
    parent: 서버 애플리케이션 설계
    aliases:
      [단위 테스트, unit test, 통합 테스트, integration test, E2E 테스트, 테스트 더블, mock, 목 객체, Testcontainers]
    description: 무엇을 어느 층에서 테스트할지, 가짜 객체 대신 실제 DB로 테스트하는 기준
    related: [테스트 러너]

  - name: 설정과 환경 분리
    parent: 서버 애플리케이션 설계
    aliases: [환경 변수, environment variable, 외부 설정, 프로파일, profile, application.yml, .env, 설정 검증]
    description: 코드와 설정을 나누고 환경별 값을 주입·검증하는 법

  # NestJS
  - name: NestJS
    aliases: [Nest, Nest.js, 네스트]
    description: 모듈·프로바이더·데코레이터로 Node 서버를 구성하는 프레임워크
    requires: [Node.js 런타임]

  - name: Nest 모듈 시스템
    parent: NestJS
    aliases: [Nest 모듈, '@Module', imports와 exports, 동적 모듈, dynamic module, forRoot, '@Global', 루트 모듈]
    description: 모듈이 프로바이더를 묶고 내보내는 범위, 동적 모듈과 전역 모듈
    requires: [의존성 주입과 IoC]

  - name: Nest 프로바이더와 주입
    parent: NestJS
    aliases:
      [
        provider,
        프로바이더,
        '@Injectable',
        주입 토큰,
        injection token,
        useFactory,
        useClass,
        useValue,
        프로바이더 스코프,
      ]
    description: 컨테이너가 프로바이더를 만들고 주입하는 방식, 토큰과 팩토리, 스코프
    requires: [Nest 모듈 시스템]

  - name: Nest 요청 생명주기
    parent: NestJS
    aliases: [Guard, 가드, Nest Pipe, ValidationPipe, Nest 인터셉터, Exception Filter, 예외 필터, Nest 미들웨어]
    description: 미들웨어·가드·인터셉터·파이프·예외 필터가 실행되는 순서와 각각에 둘 일
    requires: [요청 처리 파이프라인]

  - name: 데코레이터와 메타데이터
    parent: NestJS
    aliases:
      [decorator, 데코레이터, reflect-metadata, 메타데이터, emitDecoratorMetadata, DiscoveryService, 커스텀 데코레이터]
    description: 데코레이터가 메타데이터를 붙이고 프레임워크가 그것을 읽어 동작을 정하는 원리
    requires: [프로토타입과 클래스]
    related: [tsconfig와 컴파일]

  - name: Nest 애플리케이션 시작과 종료
    parent: NestJS
    aliases:
      [
        NestFactory,
        애플리케이션 컨텍스트,
        createApplicationContext,
        라이프사이클 훅,
        onModuleInit,
        onApplicationShutdown,
        enableShutdownHooks,
      ]
    description: 앱이 모듈 그래프를 만들고 시작·종료 훅을 부르는 순서
    requires: [Nest 프로바이더와 주입]

  # Spring
  - name: Spring
    aliases: [Spring Framework, 스프링, Spring Boot, 스프링 부트]
    description: 자바 생태계의 대표 서버 프레임워크
    requires: [컴파일 언어와 가상 머신]

  - name: 스프링 컨테이너와 빈
    parent: Spring
    aliases:
      [ApplicationContext, 빈, Bean, 스프링 빈, 빈 생명주기, 빈 스코프, 컴포넌트 스캔, '@Component', '@Bean', 싱글톤 빈]
    description: 컨테이너가 빈을 찾고 만들고 주입하는 과정과 생명주기·스코프
    requires: [의존성 주입과 IoC]

  - name: 스프링 부트 자동 설정
    parent: Spring
    aliases: [auto-configuration, 자동 설정, 자동 구성, starter, 스타터, '@SpringBootApplication', '@Conditional']
    description: 의존성과 조건에 따라 빈이 자동 등록되는 원리와 덮어쓰는 법
    requires: [스프링 컨테이너와 빈]

  - name: AOP와 프록시
    parent: Spring
    aliases: [AOP, 관점 지향 프로그래밍, 동적 프록시, CGLIB, JDK 동적 프록시, 프록시 자기 호출, self-invocation]
    description: 프록시로 부가 기능을 끼워 넣는 원리와 자기 호출 때 적용되지 않는 함정
    requires: [스프링 컨테이너와 빈]

  - name: Spring MVC 요청 처리
    parent: Spring
    aliases:
      [
        Spring MVC,
        DispatcherServlet,
        디스패처 서블릿,
        서블릿,
        Servlet,
        HandlerMapping,
        ArgumentResolver,
        '@Controller',
        '@RestController',
        메시지 컨버터,
      ]
    description: 요청이 서블릿 컨테이너와 DispatcherServlet을 거쳐 컨트롤러에 닿고 응답이 되는 흐름
    requires: [요청 처리 파이프라인]
    related: [동시 요청 처리 모델]

  - name: 서블릿 필터와 인터셉터
    parent: Spring
    aliases: [Servlet Filter, 서블릿 필터, HandlerInterceptor, 스프링 인터셉터, '@ControllerAdvice']
    description: 필터와 인터셉터가 끼어드는 위치의 차이, 전역 예외 처리
    requires: [Spring MVC 요청 처리]

  - name: Spring Security
    parent: Spring
    aliases: [스프링 시큐리티, SecurityFilterChain, 시큐리티 필터 체인, SecurityContext]
    description: 필터 체인으로 인증·인가를 처리하는 구조
    requires: [서블릿 필터와 인터셉터, 인증과 인가]

  - name: JPA와 Hibernate
    parent: Spring
    aliases: [JPA, Hibernate, 하이버네이트, Spring Data JPA, 엔티티 매핑, '@Entity', 연관관계 매핑]
    description: 엔티티와 연관관계를 매핑하는 법과 Spring Data JPA 저장소
    requires: [ORM과 SQL 매핑]

  - name: 영속성 컨텍스트
    parent: Spring
    aliases: [persistence context, 1차 캐시, 변경 감지, dirty checking, 준영속, detached, flush, EntityManager]
    description: 엔티티를 관리하는 영속성 컨텍스트와 변경 감지·플러시가 일어나는 시점
    requires: [JPA와 Hibernate]
    related: [트랜잭션 관리]

  - name: 지연 로딩과 N+1
    parent: Spring
    aliases: [N+1, N+1 문제, lazy loading, 지연 로딩, 즉시 로딩, fetch join, 페치 조인, EntityGraph, batch size]
    description: 연관 엔티티를 언제 불러오나, N+1이 생기는 이유와 페치 조인·배치 크기로 고치는 법
    requires: [영속성 컨텍스트, 조인]
