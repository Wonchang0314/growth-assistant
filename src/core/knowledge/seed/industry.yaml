# 시드 개념: 산업별 업무 (ADR-0042). 형식은 accounting.yaml 머리말

track:
  key: industry
  name: 산업별 업무
  weight: 0.2
  description: 시험인증(KOLAS·성적서), 화장품(전성분·표시광고 실증), 법무(사건 관리·보수 청구·비밀유지), 의료기기 유통

concepts:
  - name: 산업별 업무
    aliases: [업종별 업무, 산업 도메인, 업종 특수 업무]
    description: 업종마다 법령·관행 때문에 달라지는 업무 흐름과 용어

  # 시험인증
  - name: 시험인증과 KOLAS
    parent: 산업별 업무
    aliases:
      [KOLAS, 한국인정기구, 공인시험기관, ISO/IEC 17025, KS Q ISO/IEC 17025, 공인시험, 일반시험, 인정 범위, ILAC MRA]
    description: 국가기술표준원 산하 KOLAS가 ISO/IEC 17025로 시험기관을 인정하고, 인정 범위 안의 시험만 공인 성적서가 되는 구조

  - name: 시험 의뢰와 시료 관리
    parent: 시험인증과 KOLAS
    aliases: [시험 의뢰, 시험 의뢰서, 의뢰 접수, 시료 접수, 시료 식별, 시험 규격, 시험수수료]
    description: 의뢰 접수와 시험 규격·수수료 확정, 시료를 받아 식별하고 보관·반환하는 흐름
    requires: [시험인증과 KOLAS]

  - name: 시험성적서
    parent: 시험인증과 KOLAS
    aliases: [성적서, 공인성적서, test report, 성적서 번호, 기술책임자, 성적서 정정, 성적서 재발행]
    description: 접수 한 건에서 여러 장이 나올 수 있는 성적서, 기술책임자 승인, 정정은 원본을 대체한다고 밝힌 새 성적서로
    requires: [시험 의뢰와 시료 관리]
    related: [결재와 전결, 번호 체계]

  # 화장품
  - name: 화장품 표시 사항
    parent: 산업별 업무
    aliases:
      [
        전성분,
        전성분 표시,
        화장품 기재사항,
        제조번호,
        사용기한,
        개봉 후 사용기간,
        책임판매업자,
        화장품책임판매업,
        화장품법,
      ]
    description: 화장품법이 용기·포장에 적게 하는 전성분·제조번호·사용기한과 책임판매업자 같은 사항
    related: [로트 관리]

  - name: 화장품 표시·광고 실증
    parent: 화장품 표시 사항
    aliases: [표시광고 실증, 광고 실증, 실증자료, 인체적용시험, 실증 대상 표현, 효능 표현]
    description: 사실에 관한 표시·광고는 영업자가 실증할 수 있어야 하고, 식약처가 요청하면 실증자료를 내야 하는 의무
    requires: [화장품 표시 사항]

  # 법무
  - name: 법무 사건 관리
    parent: 산업별 업무
    aliases:
      [
        사건 관리,
        매터 관리,
        matter management,
        사건 수임,
        사건 배당,
        사건 종결,
        이해충돌 확인,
        conflict check,
        수임 제한,
      ]
    description: 수임 전 이해충돌 확인부터 배당·수행·종결까지 사건 단위로 일과 시간을 묶는 관리

  - name: 법률 보수와 청구
    parent: 법무 사건 관리
    aliases: [변호사 보수, 수임료, 착수금, 성공보수, 시간제 보수, 타임차지, time charge, 보수 청구, 미청구 사건]
    description: 착수금·성공보수·시간제 보수의 차이와 종결 뒤에도 청구하지 않은 사건 찾기. 형사사건 성공보수 약정은 무효(2015 대법원)
    requires: [법무 사건 관리]
    related: [수익 인식]

  - name: 비밀유지 의무
    parent: 법무 사건 관리
    aliases: [비밀유지, 변호사 비밀유지의무, 의뢰인 비밀, confidentiality, 사건 자료 보호, 정보 차단벽]
    description: 변호사법이 정한 직무상 비밀 유지와, 사건 자료를 담당자 밖으로 새지 않게 하는 업무 관행
    related: [접근 권한 원칙]

  # 의료기기
  - name: 의료기기 유통
    parent: 산업별 업무
    aliases:
      [
        의료기기,
        의료기기 등급,
        의료기기 판매업,
        의료기기법,
        요양기관,
        공급내역 보고,
        의료기기 공급내역 보고,
        UDI,
        의료기기 표준코드,
        의료기기통합정보시스템,
      ]
    description: 위해도에 따른 1~4등급, 병의원(요양기관) 거래, 공급한 다음 달 말일까지 하는 공급내역 보고
    related: [로트 관리]
