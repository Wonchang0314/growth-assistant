# 시드 개념: MCP와 이 서버 설계 (ADR-0022). 형식은 js.yaml 머리말
# 목적: 이 MCP 서버(growth-assistant)가 어떻게 동작하고 왜 이렇게 설계됐는지 이해해,
# 기능을 더하거나 성능을 개선할 지점을 스스로 찾을 수 있게 한다. 설계 개념은 다른 선택지와의 트레이드오프로 묻는다.

track:
  key: mcp
  name: MCP와 이 서버 설계
  weight: 0.2
  description: MCP 스펙과 모델이 도구를 쓰는 방식, 이 서버의 구조와 설계 결정(ADR)의 트레이드오프, 확장·성능 개선 지점

concepts:
  # MCP 프로토콜
  - name: MCP 프로토콜
    aliases: [MCP, Model Context Protocol, 모델 컨텍스트 프로토콜, MCP 스펙, MCP specification]
    description: LLM 앱이 바깥 도구·데이터에 붙는 방식을 정한 공개 표준

  - name: 호스트·클라이언트·서버 구조
    parent: MCP 프로토콜
    aliases: [MCP 호스트, MCP host, MCP 클라이언트, MCP client, MCP 서버, MCP server, 클라이언트-서버 구조]
    description: Claude Desktop(호스트)이 서버마다 클라이언트를 하나씩 두고 연결하는 구조와 각자의 책임

  - name: JSON-RPC 메시지
    parent: MCP 프로토콜
    aliases: [JSON-RPC, JSON-RPC 2.0, 요청과 응답, 알림 메시지, notification, request id]
    description: MCP 메시지의 바탕인 JSON-RPC의 요청·응답·알림과 id로 짝을 맞추는 방식

  - name: 연결 수명주기와 기능 협상
    parent: MCP 프로토콜
    aliases:
      [
        initialize,
        initialized,
        capabilities,
        기능 협상,
        capability negotiation,
        protocolVersion,
        프로토콜 버전 협상,
        연결 종료,
      ]
    description: initialize로 버전과 서로 지원하는 기능을 맞추고, 연결을 쓰고, 닫는 순서
    requires: [JSON-RPC 메시지]

  - name: MCP 전송 방식
    parent: MCP 프로토콜
    aliases:
      [
        transport,
        MCP transport,
        stdio,
        stdio 전송,
        표준입출력,
        Streamable HTTP,
        SSE 전송,
        메모리 전송,
        InMemoryTransport,
      ]
    description: 호스트가 서버 프로세스를 띄워 표준입출력으로 말하는 stdio와, 원격 서버용 Streamable HTTP의 차이
    requires: [JSON-RPC 메시지]
    related: [프로세스 간 통신, 소켓과 포트]

  - name: MCP 도구
    parent: MCP 프로토콜
    aliases: [MCP tool, tools/list, tools/call, inputSchema, 도구 정의, tool definition]
    description: 서버가 도구 목록과 입력 스키마를 알리고 호스트가 호출하는 방식, zod 스키마가 JSON Schema로 바뀌는 경로
    requires: [연결 수명주기와 기능 협상]
    related: [타입 단언과 런타임 검증]

  - name: 도구 결과와 구조화된 출력
    parent: MCP 프로토콜
    aliases: [structuredContent, outputSchema, isError, content 블록, 도구 결과, tool result, 도구 오류]
    description: 텍스트 content와 structuredContent를 함께 주는 이유, 예외를 isError 결과로 돌려주는 방식
    requires: [MCP 도구]

  - name: 도구 주석
    parent: MCP 프로토콜
    aliases: [tool annotations, annotations, readOnlyHint, destructiveHint, openWorldHint, idempotentHint]
    description: 읽기 전용·파괴적 같은 힌트가 호스트의 호출 승인 동작에 주는 영향과 한계(강제가 아님)
    requires: [MCP 도구]

  - name: 리소스와 프롬프트
    parent: MCP 프로토콜
    aliases: [MCP resources, 리소스, resources/read, 리소스 구독, MCP prompts, 프롬프트 템플릿, prompts/get]
    description: 도구 말고 서버가 줄 수 있는 것(읽을 데이터, 사용자가 고르는 프롬프트)과 도구 대신 써야 할 때
    related: [MCP 도구]

  - name: 서버 instructions
    parent: MCP 프로토콜
    aliases: [instructions, server instructions, 서버 지침, MCP 서버 지침]
    description: 연결할 때 서버가 주는 사용 지침이 모델 컨텍스트에 들어가는 방식과 프로젝트 지침과의 역할 분담
    requires: [연결 수명주기와 기능 협상]

  - name: 클라이언트 기능
    parent: MCP 프로토콜
    aliases: [sampling, 샘플링, sampling/createMessage, elicitation, 엘리시테이션, roots, 클라이언트 쪽 기능]
    description: 서버가 호스트에게 모델 호출(sampling)이나 사용자 입력(elicitation)을 요청하는 기능과 쓸 수 있는 경우
    requires: [연결 수명주기와 기능 협상]

  - name: 원격 MCP 서버와 인증
    parent: MCP 프로토콜
    aliases:
      [
        remote MCP,
        원격 MCP,
        커스텀 커넥터,
        custom connector,
        원격 커넥터,
        OAuth 2.1,
        MCP 인증,
        보호된 리소스 메타데이터,
      ]
    description: 모바일에서 쓰려면 필요한 원격 서버(Streamable HTTP)와 OAuth 인증, 공개 경로(터널)의 선택지
    requires: [MCP 전송 방식, 인증과 인가]

  - name: MCP Apps
    parent: MCP 프로토콜
    aliases: [MCP Apps, UI 리소스, ui 리소스, 인터랙티브 UI, 채팅 안 UI, Apps SDK]
    description: 도구 결과로 대화 안에 UI(객관식 카드 등)를 그리는 확장과, 답이 서버로 바로 가는 구조
    requires: [리소스와 프롬프트, 도구 결과와 구조화된 출력]

  - name: MCP 보안
    parent: MCP 프로토콜
    aliases: [tool poisoning, 도구 포이즈닝, 프롬프트 주입, prompt injection, 도구 승인, 사용자 동의, confused deputy]
    description: 도구 설명·결과를 통한 프롬프트 주입, 쓰기 도구 승인, 로컬 서버가 가진 권한의 위험
    related: [도구 주석]

  # 모델이 도구를 쓰는 방식
  - name: LLM 도구 사용
    aliases: [function calling, 함수 호출, 도구 호출, tool calling]
    description: 모델이 대화 중에 도구를 골라 부르고 결과를 받아 답을 이어 가는 방식

  - name: 도구 호출 루프
    parent: LLM 도구 사용
    aliases: [tool_use, agent loop, 에이전트 루프, 도구 사용 흐름]
    description: 호스트가 MCP 도구를 모델의 도구 정의로 바꾸고, 모델의 tool_use를 서버 호출로 옮기고, 결과를 다시 넣는 한 바퀴
    requires: [MCP 도구]

  - name: 컨텍스트 윈도와 토큰 비용
    parent: LLM 도구 사용
    aliases: [context window, 컨텍스트 윈도, 컨텍스트 창, 토큰 비용, token usage, 프롬프트 캐싱, prompt caching]
    description: 도구 정의·지침·도구 결과가 모두 컨텍스트를 차지한다는 점과, 결과를 짧게 주는 설계가 비용과 품질에 주는 영향

  - name: 도구 검색과 지연 로딩
    parent: LLM 도구 사용
    aliases: [tool search, ToolSearch, deferred tools, 도구 지연 로딩, deferred tool loading]
    description: 도구가 많을 때 호스트가 정의를 미리 다 싣지 않고 검색해 불러오는 방식, 그때 도구 이름·설명이 중요해지는 이유
    requires: [컨텍스트 윈도와 토큰 비용]

  - name: 도구 설명 설계
    parent: LLM 도구 사용
    aliases: [tool description, 도구 설명, 도구 이름 설계, describe, 스키마 설명]
    description: 모델이 도구를 언제 부를지 고르는 근거가 이름·설명·스키마 설명(.describe)뿐이라는 점과 잘 쓰는 법
    requires: [도구 호출 루프]

  - name: 프롬프트 설계
    parent: LLM 도구 사용
    aliases: [prompt engineering, 프롬프트 엔지니어링, 시스템 프롬프트, system prompt, 지침 설계, 프로젝트 지침]
    description: 서버 instructions·프로젝트 지침·도구 설명에 무엇을 나눠 둘지, 지침이 강제가 아니라서 서버가 지켜야 할 규칙
    related: [서버 instructions]

  # 이 서버의 설계
  - name: growth-assistant 설계
    aliases: [growth-assistant, 이 MCP 서버, 이 서버 구조, 서버 아키텍처]
    description: 이 서버의 구조와 설계 결정(ADR), 각 결정의 대안과 트레이드오프

  - name: 인터페이스 선택
    parent: growth-assistant 설계
    aliases: [Claude 앱 + MCP, Discord 봇에서 MCP로, PWA 대안, 인터페이스 결정, ChatGPT 전환]
    description: Discord 봇 → PWA → Claude 앱 + MCP로 바꾼 이유(ADR-0017·0018), 대화는 앱이 하고 서버는 도구만 주는 구조의 득실
    related: [호스트·클라이언트·서버 구조]

  - name: stdio 진입점과 프로세스 수명
    parent: growth-assistant 설계
    aliases: [mcp-stdio, 진입점, HTTP 없는 Nest, 표준출력과 로그 분리, 서버 프로세스 수명]
    description: Desktop이 서버를 띄우고 표준입력을 닫으면 끝나는 수명, HTTP 없이 Nest 애플리케이션 컨텍스트로 띄우는 이유, 표준출력에 로그를 쓰면 안 되는 이유
    requires: [MCP 전송 방식, Nest 애플리케이션 시작과 종료]

  - name: 도구 처리기 탐색과 등록
    parent: growth-assistant 설계
    aliases: [McpServerHost, '@McpTool', McpToolHandler, 도구 등록, Discovery 기반 등록]
    description: 기능 모듈의 처리기를 데코레이터로 표시하고 Host가 모아 SDK에 등록하는 구조, 처리기가 SDK를 모르게 한 이유
    requires: [데코레이터와 메타데이터, Nest 모듈 시스템, MCP 도구]

  - name: 모듈 경계와 의존 방향
    parent: growth-assistant 설계
    aliases: [core와 tutor, 기능 모듈 구조, 외부 경계 분리, quiz 레이어 폴더]
    description: core·tutor로 나누고 외부 경계만 포트로 감싼 구조(ADR-0015), quiz에서 레이어 폴더를 시험하는 이유(ADR-0020)
    related: [계층 구조와 포트·어댑터]

  - name: 백그라운드 LLM 호출
    parent: growth-assistant 설계
    aliases:
      [
        ClaudeCliClient,
        claude -p,
        stream-json,
        구독으로 LLM 호출,
        서브프로세스 LLM 호출,
        llm_call_log,
        API 키 없는 호출,
      ]
    description: 문제 생성처럼 대화 밖의 LLM 작업을 claude CLI 서브프로세스로 부르는 이유(ADR-0002·0012), API·sampling과의 트레이드오프, 시간 초과와 호출 로그
    requires: [프로세스 관계와 권한]
    related: [클라이언트 기능]

  - name: 통제 어휘와 개념 매칭
    parent: growth-assistant 설계
    aliases: [통제 어휘, controlled vocabulary, matchConcepts, 이름 별칭 매칭, 임베딩 없는 검색, 개념 매칭]
    description: 임베딩 대신 개념 이름·별칭으로 주제를 찾는 방식(ADR-0005)의 장단점, 오탐을 막는 규칙, 개념 승인 정책
    related: [개념 그래프 저장]

  - name: 개념 그래프 저장
    parent: growth-assistant 설계
    aliases: [개념 그래프, concept graph, 개념 간선, 그래프 DB 대안, 시드 적재]
    description: 그래프 DB 없이 PostgreSQL 간선 테이블과 재귀 CTE로 선수 체인을 찾는 방식(ADR-0004)과 시드 YAML 적재
    requires: [서브쿼리와 CTE]

  - name: 숙련도와 간격 반복
    parent: growth-assistant 설계
    aliases: [FSRS, ts-fsrs, 간격 반복, spaced repetition, 숙련도 계산, 망각 곡선]
    description: 복습 시점을 FSRS로 정하고 숙련도를 코드가 계산하는 설계(ADR-0009·0016), 채점을 모델에 맡기지 않는 이유

  - name: 배포와 실행 구조
    parent: growth-assistant 설계
    aliases: [릴리스 디렉터리, current 링크, deploy.sh, desktop-config, Desktop이 서버를 띄우는 방식]
    description: 릴리스마다 디렉터리를 두고 current 링크를 바꾸는 배포, 개발 중인 작업 트리와 Desktop이 쓰는 서버를 떼어 둔 이유
    related: [프로그램 설치]

  - name: 이 서버의 테스트 구조
    parent: growth-assistant 설계
    aliases: [메모리 전송 테스트, 앱 전체 테스트, db 테스트 프로젝트, 녹화한 CLI 스트림]
    description: 단위·DB 통합·앱 전체 테스트로 나눈 구조, 메모리 전송으로 실제 MCP 클라이언트를 붙여 검사하는 방식
    related: [테스트 전략]

  - name: 로그와 관측
    parent: growth-assistant 설계
    aliases: [파일 로그, LOG_DIR, 회전 로그, 도구 호출 시간, 운영 알림, observability, 관측성]
    description: 도구 호출 시간과 실패를 남기는 방식, 무엇을 더 기록해야 품질·성능 문제를 찾을 수 있나

  - name: 도구 지연과 시작 시간
    parent: growth-assistant 설계
    aliases: [도구 응답 시간, latency, 지연 시간, 콜드 스타트, cold start, 서버 시작 시간]
    description: 서버 시작(Nest 부팅, DB 연결)과 도구 호출마다 드는 비용(개념 목록 조회, 쿼리 수), 줄일 수 있는 지점
    requires: [로그와 관측]
    related: [커넥션과 프로세스 구조]

  - name: 먼저 말 걸기 설계
    parent: growth-assistant 설계
    aliases: [먼저 말 걸기, outreach, 예약 작업, scheduled task, 놓친 실행 복구, 아침 복습]
    description: 서버는 요청에만 답하는데 먼저 말을 걸려면 무엇이 필요한가(ADR-0019), 예약 작업·푸시·원격 전환의 선택지
    related: [원격 MCP 서버와 인증]
