# 시드 개념: 영업·유통 채널 (ADR-0042). 형식은 accounting.yaml 머리말

track:
  key: sales
  name: 영업·유통 채널
  weight: 0.2
  description: 견적→수주→출고→매출 흐름, 단가 체계·마진·구간단가, 수주잔고, 유통 거래 형태(직매입·특약매입·위탁), 판촉분담금, 셀인·셀아웃, 오픈마켓 정산·할인 부담, 주문 통합·클레임·송장

concepts:
  - name: 영업·판매 프로세스
    aliases: [판매 프로세스, 영업 프로세스, order to cash, O2C, 견적에서 수금까지]
    description: 견적→수주→출고→매출→수금으로 이어지는 판매 흐름과 단계마다 남는 문서
    related: [매출채권]

  # 수주와 출고
  - name: 견적 관리
    parent: 영업·판매 프로세스
    aliases: [견적서, quotation, 견적 유효기간, 견적 단가, 견적 확정]
    description: 거래처에 제시하는 품목·수량·단가·조건과 유효기간, 단가표가 바뀌어도 이미 낸 견적의 단가를 지키는 이유

  - name: 수주와 수주 라인
    parent: 영업·판매 프로세스
    aliases: [sales order, 수주서, 수주 헤더, 수주 라인, 주문 라인, 라인별 취소, 수주 등록]
    description: 거래처·납기 같은 헤더와 품목별 라인으로 나뉜 수주 구조, 라인 단위 취소·부분 출고·완료
    requires: [견적 관리]
    related: [작업지시]

  - name: 출고지시와 거래명세서
    parent: 영업·판매 프로세스
    aliases: [출고지시, 출고지시서, 출하지시, delivery order, 거래명세서, 납품서]
    description: 수주에서 창고에 내리는 출고지시와 물품과 함께 건네는 거래명세서, 세금계산서와의 차이
    requires: [수주와 수주 라인]
    related: [재고 할당, 세금계산서]

  # 가격
  - name: 단가 체계
    parent: 영업·판매 프로세스
    aliases:
      [단가표, price list, 가격 정책, 등급별 단가, 거래처 단가 그룹, 소비자가, 권장소비자가격, 특별 단가, 특가 승인]
    description: 거래처 등급(도매 등급 등)별 단가, 소비자가와 거래처 단가 그룹, 정해진 단가를 벗어난 특별 단가의 승인

  - name: 마진율과 역마진
    parent: 영업·판매 프로세스
    aliases: [마진율, 마크업률, markup, 매출총이익률, gross margin, 역마진, 원가 미만 판매]
    description: 판매가 기준 마진율과 원가 기준 마크업률의 차이, 원가보다 싸게 파는 역마진을 막거나 승인받는 규칙
    requires: [단가 체계, 매출원가]

  - name: 수량 구간단가
    parent: 영업·판매 프로세스
    aliases: [구간단가, 볼륨 할인, volume discount, 수량 할인, 합산 수량 구간, 분할 주문 합산]
    description: 주문 수량 구간에 따라 단가가 내려가는 방식, 여러 품목·분할 주문의 수량을 합산해 구간을 정하는 규칙
    requires: [단가 체계]

  - name: 수주잔고와 Book-to-Bill
    parent: 영업·판매 프로세스
    aliases: [수주잔고, backlog, 수주잔량, Book-to-Bill, BB ratio, 수주 대비 매출]
    description: 받았지만 아직 매출로 넘기지 않은 수주 금액과, 기간 수주액÷매출액으로 수요 추세를 보는 지표
    requires: [수주와 수주 라인]

  # 유통 거래
  - name: 유통 거래 형태
    parent: 영업·판매 프로세스
    aliases: [직매입, 특약매입, 위탁판매, 임대매장, 수수료 매장, 본인과 대리인, 총액 매출, 순액 매출]
    description: 직매입·특약매입·위탁판매·임대 매장에서 재고 위험을 누가 지는지와, 그에 따라 매출을 총액·순액으로 잡는 차이
    related: [수익 인식]

  - name: 특약매입 정산
    parent: 영업·판매 프로세스
    aliases: [백화점 정산, 백화점 판매수수료, 특약매입 수수료율, 정상 마진율, 행사 마진율, 마감자료, 입금예정액]
    description: 팔린 만큼만 매입으로 확정하고(남은 재고는 반품) 판매 수수료를 뺀 금액을 납품업체에 주는 백화점 정산과 마감자료 대사
    requires: [유통 거래 형태]

  - name: 판촉비 분담
    parent: 영업·판매 프로세스
    aliases: [판촉분담금, 판매촉진비용 분담, 판촉비 분담 비율, 대규모유통업법, 행사 분담금]
    description: 유통사 행사의 판매촉진비용을 납품업체와 나누는 약정, 대규모유통업법의 사전 서면 약정과 납품업자 분담 50% 상한
    requires: [유통 거래 형태]
    related: [매출 차감 항목]

  - name: 셀인과 셀아웃
    parent: 영업·판매 프로세스
    aliases: [셀인, 셀아웃, sell-in, sell-out, POS 판매 데이터, 유통 재고]
    description: 유통사 입고로 잡는 셀인 매출과 소비자 판매(POS)인 셀아웃의 차이, 둘의 격차로 유통 재고를 읽는 법
    related: [재고회전율과 재고소진일]

  # 온라인 채널
  - name: 오픈마켓 판매와 정산
    parent: 영업·판매 프로세스
    aliases: [오픈마켓, 마켓플레이스, marketplace, 오픈마켓 수수료, 정산 주기, 정산 내역 대사, 채널 정산금]
    description: 오픈마켓 판매 수수료와 정산 주기, 채널이 보내는 정산 내역을 주문·매출과 맞추는 대사

  - name: 할인 부담 주체
    parent: 영업·판매 프로세스
    aliases: [판매자부담할인, 판매자 쿠폰, 플랫폼 쿠폰, 플랫폼부담할인, 쿠폰 부담 주체, 공급사 정산가]
    description: 같은 할인이라도 판매자 부담인지 플랫폼 부담인지에 따라 매출액과 공급사 정산가가 달라지는 처리
    requires: [오픈마켓 판매와 정산]
    related: [매출 차감 항목]

  - name: 주문 통합과 주문 검수
    parent: 영업·판매 프로세스
    aliases: [OMS, 주문 수집, 주문 통합, 채널 주문 통합, 표준 상품 매핑, 도서산간, 중복 주문, 주문 검수]
    description: 여러 채널 주문을 한곳에 모아 표준 상품에 매핑하고 주소·도서산간·중복을 출고 전에 걸러 내는 검수

  - name: 위탁 배송
    parent: 영업·판매 프로세스
    aliases: [공급사 직송, 위탁 발주, drop shipping, 드롭쉬핑, 직배송]
    description: 재고를 두지 않고 공급사에 발주해 고객에게 바로 보내는 방식, 자사 출고와 분리해 관리하는 것과 발주 후 취소
    requires: [주문 통합과 주문 검수]
    related: [발주서]

  - name: 송장과 배송 상태
    parent: 영업·판매 프로세스
    aliases: [운송장, 운송장 번호, 송장 등록, 택배사 코드, 송장 역전송, 배송 추적, 회수 송장]
    description: 출고 뒤 운송장 번호를 등록하고 채널에 되돌려 보내는 흐름, 배송 상태 추적과 반품 회수 송장
    requires: [주문 통합과 주문 검수]

  - name: 주문 클레임
    parent: 영업·판매 프로세스
    aliases: [클레임, 주문 취소, 반품 요청, 교환 요청, 반품 회수, 회수 검수, 원주문 없는 클레임]
    description: 취소·반품·교환 요청을 원주문에 묶어 처리하고 회수 검수 뒤 환불하는 흐름
    requires: [주문 통합과 주문 검수]
    related: [반품 크레딧]
