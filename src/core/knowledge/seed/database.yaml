    related: [집계와 GROUP BY]

  - name: UPSERT와 일괄 처리
    parent: SQL 쿼리
    aliases: [UPSERT, ON CONFLICT, MERGE, 일괄 삽입, bulk insert, COPY, RETURNING]
    description: 있으면 고치고 없으면 넣기, 대량 데이터를 한 번에 넣고 바꾸는 법
    requires: [키와 제약 조건]

