    description: 시간에 따라 바뀌는 데이터와 상태 전이를 테이블로 표현하는 패턴
    requires: [정규화]

  - name: 데이터 그레인
    parent: 데이터 모델링
    aliases: [grain, 그레인, 한 행의 의미, 행 단위]
    description: 한 행이 무엇 하나를 뜻하는지 정하는 일과, 그레인이 다른 테이블을 조인할 때 생기는 문제

  - name: 운영 중 스키마 변경
