    parent: SQL 쿼리
    aliases: [JOIN, 내부 조인, INNER JOIN, 외부 조인, LEFT JOIN, OUTER JOIN, 셀프 조인, 행 증식, 카테시안 곱]
    description: 조인 종류와 결과 행 수가 정해지는 원리, 조인으로 행이 불어나는 함정
    requires: [키와 제약 조건]

  - name: 집계와 GROUP BY
    parent: SQL 쿼리
    aliases: [GROUP BY, HAVING, 집계 함수, aggregate, COUNT, 조건부 집계, FILTER 절]
    description: 그룹으로 묶어 요약하는 법과 WHERE·HAVING의 차이, 조건부 집계
    related: [SQL NULL과 3값 논리]

  - name: 서브쿼리와 CTE
    parent: SQL 쿼리
