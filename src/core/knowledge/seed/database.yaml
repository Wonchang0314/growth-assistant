    description: 조회 성능이나 단순함을 위해 정규화를 되돌리는 기준과 정합성을 지키는 비용
    requires: [정규화]

  - name: 다대다와 연결 테이블
    parent: 데이터 모델링
    aliases: [다대다, many-to-many, N:M, 연결 테이블, 조인 테이블, 매핑 테이블, 교차 엔터티]
