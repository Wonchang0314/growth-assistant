        REPEATABLE READ,
        SERIALIZABLE,
        dirty read,
        non-repeatable read,
        phantom read,
        팬텀 리드,
      ]
    description: 동시 트랜잭션끼리 서로의 변경이 보이는 정도와 수준별 이상 현상
