# 시드 개념: 프론트 심화 (ADR-0021). 형식은 cs.yaml 머리말을 따른다.

track:
  key: frontend
  name: 프론트 심화
  weight: 0.2
  description: 지금 쓰는 스택. JS/TS, React, Vite(Rollup), TanStack Query, 상태관리(jotai·XState), 브라우저 렌더링·성능, WebGL 시각화

concepts:
  # JavaScript 언어
  - name: JavaScript 언어
    aliases:
      [
        JavaScript,
        JS,
        ECMAScript,
        원시 타입과 참조 타입,
        primitive,
        reference type,
        '==',
        '===',
        type coercion,
        형변환,
        프로토타입과 클래스,
        prototype,
        prototype chain,
        class,
        상속,
        WeakMap과 약한 참조,
        WeakMap,
        WeakRef,
        weak reference,
        객체 키 캐시,
      ]
    description: 타입(원시·참조), 객체와 프로토타입, 함수, 스코프 등 언어 기본기

  - name: 참조 동일성
    parent: JavaScript 언어
    aliases: [referential equality, identity, Object.is, 얕은 비교, shallow compare]
    description: 내용이 같아도 새 객체면 다르다. 리렌더, 메모 무효화, 라이브러리 재계산의 공통 원인이다

  - name: 복사와 불변성
    parent: JavaScript 언어
    aliases: [shallow copy, deep copy, structuredClone, immutability, 불변성, spread]
    description: 중첩 참조를 공유하는 얕은 복사와, 원본을 바꾸지 않고 새 값을 만드는 습관

  - name: 실행 컨텍스트와 스코프
    parent: JavaScript 언어
    aliases:
      [
        execution context,
        lexical environment,
        hoisting,
        호이스팅,
        TDZ,
        scope chain,
        스코프 체인,
        this 바인딩,
        this,
        arrow function,
        화살표 함수,
        bind,
        call,
        apply,
      ]
    description: 선언이 먼저 등록되고 바깥 렉시컬 환경으로 식별자를 찾아 올라가는 구조. this는 호출 방식이 정하고 화살표 함수는 바깥 this를 쓴다

  - name: 클로저
    parent: JavaScript 언어
    aliases: [closure, stale closure, 낡은 클로저]
    description: 함수가 선언될 때의 렉시컬 환경을 기억한다. 오래된 값을 붙잡는 낡은 클로저의 원인이기도 하다
    requires: [실행 컨텍스트와 스코프]

  - name: 특수 값 함정
    parent: JavaScript 언어
    aliases: [NaN, nullish, '??', null vs undefined, Number.isFinite, falsy]
    description: NaN은 모든 비교가 거짓이고, ??와 ||는 0을 다르게 다루며, 키 생략과 null은 다르다

  - name: 디바운스와 스로틀
    parent: JavaScript 언어
    aliases: [debounce, throttle, trailing edge, 실행 중 가드, in-flight guard]
    description: 호출 빈도를 줄이는 두 방식. 비동기 작업이면 실행 중에 겹치지 않게 따로 막는다

  # 실행 모델
  - name: 이벤트 루프
    aliases:
      [
        event loop,
        call stack,
        task queue,
        macrotask,
        microtask,
        콜 스택,
        비동기 처리,
        Promise,
        async/await,
        callback,
        비동기,
      ]
    description: 싱글 스레드가 콜 스택이 비면 큐의 작업을 꺼내 실행하는 구조. 마이크로태스크가 먼저 돈다. 콜백·Promise·async/await 포함
    related: [프로세스와 스레드]

  - name: 마이크로태스크와 재진입
    parent: 이벤트 루프
    aliases: [queueMicrotask, re-entrancy, 재진입, 구독 콜백]
    description: 구독 콜백 안에서 동기로 연쇄하면 같은 스택에서 다시 들어온다. 한 틱 미루고 상태를 다시 본다

  # TypeScript
  - name: TypeScript 타입 설계
    aliases: [TypeScript, TS, 타입 시스템, interface와 type, interface, type alias, 교차 타입, intersection type]
    description: 타입으로 런타임 계약을 고정하는 방법. interface와 type, 교차 타입으로 필드 강제하기 포함
    requires: [JavaScript 언어]

  - name: 리터럴 타입과 좁히기
    parent: TypeScript 타입 설계
    aliases: [as const, literal type, type guard, narrowing, 타입 가드, 유니온]
    description: as const와 리터럴 유니온으로 문자열 계약을 타입으로 만들고, 가드로 좁힌다

  - name: 판별 유니온
    parent: TypeScript 타입 설계
    aliases: [discriminated union, tagged union, kind, exhaustive check]
    description: 공통 태그로 갈래를 나눈다. 새 갈래를 추가하면 모든 분기가 따라오는지 확인한다
    requires: [리터럴 타입과 좁히기]

  - name: satisfies 연산자
    parent: TypeScript 타입 설계
    aliases: [satisfies, 타입 주석, type annotation]
    description: 타입 주석은 타입을 넓혀 리터럴 정보를 지우고, satisfies는 검사만 하고 좁은 타입을 남긴다
    requires: [리터럴 타입과 좁히기]

  - name: 런타임 경계 검증
    parent: TypeScript 타입 설계
    aliases: [as T, type assertion, zod, parse, JSON.parse, 신뢰 경계, OpenAPI 타입 생성, openapi-typescript]
    description: as T는 검증이 아니다. 외부에서 들어온 값은 경계에서 파싱해 좁히고, API 타입은 스펙에서 생성한다

  - name: 화면 모델 어댑터
    parent: TypeScript 타입 설계
    aliases: [view model, 뷰모델, DTO 변환, anti-corruption layer, 단위 정규화]
    description: 서버 응답을 화면 모델로 바꾸는 일을 한 곳에 모으고, 단위·스케일 변환을 여기서만 한다

  # React
  - name: React 렌더링
    aliases:
      [
        React,
        리렌더,
        re-render,
        rendering,
        동시성 렌더링,
        concurrent rendering,
        useTransition,
        automatic batching,
        React 18,
        컴포넌트 간 데이터 전달,
        props,
        lifting state,
        Context,
        Provider,
        prop drilling,
      ]
    description: 컴포넌트 함수와 훅을 다시 실행하고 바뀐 부분만 DOM에 반영하는 과정. props·Context로 데이터 전달, 동시성 렌더링 포함
    requires: [JavaScript 언어]

  - name: 재조정과 key
    parent: React 렌더링
    aliases: [reconciliation, virtual DOM, 가상 DOM, Fiber, key, render phase, commit phase]
    description: 이전·새 트리를 비교해 바뀐 부분만 반영한다. key로 목록 요소의 짝을 맞춘다

  - name: useEffect와 의존성
    parent: React 렌더링
    aliases: [useEffect, dependency array, 의존성 배열, cleanup, 정리 함수]
    description: 부수효과의 실행 시점과 정리. 의존성은 참조로 비교된다
    requires: [참조 동일성]

  - name: effect로 동기화하는 함정
    parent: React 렌더링
    aliases: [derived state, effect sync, 파생 상태, 상태 동기화]
    description: 렌더 중 계산하면 될 값을 effect로 맞추거나, 다른 이유로도 바뀌는 값을 신호로 쓰면 엉뚱한 때 발화한다
    requires: [useEffect와 의존성]

  - name: 메모이제이션과 메모 경계
    parent: React 렌더링
    aliases: [useMemo, useCallback, React.memo, React Compiler, memo boundary]
    description: 의존성 하나만 바뀌어도 전부 다시 계산한다. 비싼 축과 싼 축을 나눠 메모한다
    requires: [참조 동일성]

  - name: 리렌더 범위와 구독 위치
    parent: React 렌더링
    aliases: [re-render boundary, subscription, 상태 구독, container component]
    description: 상태를 읽는 컴포넌트가 리렌더된다. 훅을 어디서 부르느냐가 리렌더 경계다

  - name: ref와 최신 값
    parent: React 렌더링
    aliases: [useRef, latest ref, useEffectEvent, forwardRef, DOM ref]
    description: 매 렌더 새로 만들어지는 함수를 의존성에서 빼고 ref로 최신 값을 읽는다

  - name: 조건부 렌더링 함정
    parent: React 렌더링
    aliases: ['&& 렌더링', falsy 0, 숫자 0 렌더, NaN 렌더]
    description: false·null은 그리지 않지만 숫자 0과 NaN은 그대로 그린다
    requires: [특수 값 함정]

  # 상태관리
  - name: 클라이언트 상태관리
    aliases: [state management, 전역 상태]
    description: 값·절차·파생 상태를 어디에 둘지 정하는 설계
    requires: [React 렌더링]

  - name: jotai atom
    parent: 클라이언트 상태관리
    aliases: [jotai, atom, derived atom, 파생 atom, write-only atom]
    description: 값 하나를 담는 전역 상자. 읽은 컴포넌트만 리렌더되고 값을 복사하지 않고 파생한다

  - name: 저장되는 상태와 스키마 진화
    parent: 클라이언트 상태관리
    aliases: [atomWithStorage, persisted state, 기본값 병합]
    description: 저장본이 기본값을 통째로 대체해 나중에 추가한 키가 비는 문제. 읽을 때 기본값과 병합한다
    requires: [웹 저장소]

  - name: 상태기계
    parent: 클라이언트 상태관리
    aliases:
      [
        state machine,
        statechart,
        XState,
        전이표,
        transition table,
        액터와 통신,
        actor,
        invoke,
        spawn,
        emit,
        output,
        sendParent,
      ]
    description: 순서가 있는 절차를 전이표로 정의해 불가능한 상태 조합을 없앤다. 순서 없는 값은 상태기계에 두지 않는다. 자식 액터의 수명과 결과 전달 포함

  - name: 상태기계 액션 순서
    parent: 상태기계
    aliases: [exit, entry, transition action, 액션 실행 순서, guard, assign]
    description: exit → 전이 액션 → entry 순으로 돈다. exit에서 지운 값을 전이 액션이 읽으면 null이 된다

  - name: 상호배타 상태 조정
    parent: 클라이언트 상태관리
    aliases: [coordinator, mutual exclusion, 단일 쓰기 창구, single writer]
    description: 서로 배타인 상태를 한 곳에서 정리하고, 쓰기를 한 창구로 모아 불변식을 지킨다

  # TanStack Query
  - name: TanStack Query
    aliases: [React Query, 서버 상태, server state]
    description: 서버 데이터를 캐시하고 요청을 합치고 다시 받는 시점을 관리하는 라이브러리
    requires: [React 렌더링]

  - name: 쿼리 키 설계
    parent: TanStack Query
    aliases: [queryKey, query key, dedup, 요청 합치기, Query, QueryObserver, QueryCache]
    description: 키가 곧 캐시 주소다. 같은 키는 요청이 합쳐지고, 키를 다르게 만들면 다른 쿼리를 구독한다

  - name: staleTime과 gcTime
    parent: TanStack Query
    aliases: [staleTime, gcTime, cacheTime, 신선도, refetch 시점]
    description: 신선함과 보관 기간은 별개다. stale은 표시일 뿐이고 재요청은 다음 계기에 일어난다
    requires: [쿼리 키 설계]

  - name: 쿼리 무효화와 캐시 갱신
    parent: TanStack Query
    aliases: [invalidateQueries, setQueryData, refetchType, optimistic update, mutation]
    description: 다시 받을지, 캐시를 직접 고칠지. refetchType으로 무효화 뒤 바로 다시 받을 범위를 정한다
    requires: [staleTime과 gcTime]

  - name: 이전 데이터 유지
    parent: TanStack Query
    aliases: [placeholderData, keepPreviousData, 깜빡임, flicker]
    description: 키가 바뀌는 동안 직전 데이터를 보여 준다. 관찰자가 새로 생기면 기억이 사라진다
    requires: [쿼리 키 설계]

  - name: 의존 쿼리와 프리페치
    parent: TanStack Query
    aliases: [enabled, dependent query, prefetchQuery, waterfall, 워터폴, useSuspenseQueries]
    description: 조건이 될 때만 요청하고 필요한 데이터를 미리 받는다. prefetchQuery는 enabled를 보지 않는다

  - name: 요청 취소와 오류 처리
    parent: TanStack Query
    aliases: [AbortSignal, AbortController, onError, QueryCache.onError, isError]
    description: 필요 없어진 요청을 취소하고, 실패를 사용자에게 드러내는 위치를 정한다

  # 브라우저 성능
  - name: 브라우저 렌더링과 성능
    aliases: [browser rendering, 웹 성능, web performance, main thread, 메인 스레드]
    description: JS 실행, 스타일, 레이아웃, 페인트가 메인 스레드 하나에 줄을 서는 구조
    requires: [이벤트 루프]

  - name: 렌더링 파이프라인
    parent: 브라우저 렌더링과 성능
    aliases: [critical rendering path, DOM, CSSOM, layout, reflow, paint, composite]
    description: HTML과 CSS가 화면 픽셀이 되는 단계와 각 단계를 다시 하게 만드는 변경

  - name: INP와 롱태스크
    parent: 브라우저 렌더링과 성능
    aliases: [INP, Interaction to Next Paint, long task, Core Web Vitals, LCP, CLS]
    description: 입력부터 다음 그리기까지의 지연. 핸들러가 빨라도 앞뒤의 긴 작업이 지연을 만든다

  - name: 작업 스케줄링
    parent: 브라우저 렌더링과 성능
    aliases: [requestAnimationFrame, requestIdleCallback, rAF, task chunking, 작업 쪼개기]
    description: 실행 시점을 프레임이나 유휴 시간으로 옮겨도 작업량은 같다. 긴 작업은 쪼개야 입력이 끼어든다

  - name: 성능 트레이스 분석
    parent: 브라우저 렌더링과 성능
    aliases: [DevTools Performance, profiler, self time, flame chart, 성능 측정]
    description: 함수별 자체 시간과 호출당 비용으로 원인을 찾고, 측정 자체가 만든 흔적을 걸러낸다

  - name: 화면 밀도와 캔버스 해상도
    parent: 브라우저 렌더링과 성능
    aliases: [devicePixelRatio, DPR, canvas, drawing buffer, 고해상도 화면]
    description: 캔버스는 CSS 크기와 버퍼 해상도가 따로다. 소수 배율이면 버퍼를 매 프레임 다시 만들 수 있다

  - name: 이벤트 전파와 위임
    parent: 브라우저 렌더링과 성능
    aliases: [event bubbling, capturing, event delegation, pointer-events, preventDefault]
    description: 이벤트가 트리를 따라 전파되는 방식과, 위에 덮인 요소를 포인터에 투명하게 만드는 법

  # WebGL 시각화
  - name: WebGL 데이터 시각화
    aliases: [deck.gl, WebGL, luma.gl, GPU 렌더링 라이브러리]
    description: 선언한 레이어를 GPU 버퍼로 구워 대량의 도형을 그리는 방식
    requires: [GPU 렌더링 파이프라인]

  - name: 레이어 갱신 비용
    parent: WebGL 데이터 시각화
    aliases:
      [
        layer diff,
        updateTriggers,
        accessor,
        data 참조,
        attribute 재계산,
        레이어 수명과 분리,
        visible toggle,
        조건부 레이어,
        overlay layer,
        하이라이트 레이어,
        layer reuse,
      ]
    description: data 참조가 같으면 버퍼를 다시 쓰고, 트리거가 바뀌면 모든 항목을 다시 계산한다. 숨김과 제거의 차이, 자주 바뀌는 강조를 작은 레이어로 떼어 내기 포함
    requires: [참조 동일성]

  - name: 속성 버퍼와 uniform
    parent: WebGL 데이터 시각화
    aliases: [attribute, uniform, binary attributes, Float32Array, typed array]
    description: 항목마다 다른 값은 다시 구워야 하고, 전체 공통값은 상수 하나만 바꾸면 된다
    requires: [인스턴싱과 컬링]

  - name: GPU 피킹
    parent: WebGL 데이터 시각화
    aliases: [picking, color picking, picking buffer, info.object, hover]
    description: 객체마다 고유 색으로 다시 그려 커서 픽셀을 읽는다. 읽기가 GPU를 기다리게 만든다
    requires: [GPU 동기화 비용]

